<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes ── */
    :root {
      --bg:#0a0a0a; --surface:#131313; --surface-done:#111;
      --border:#1c1c1c; --border-hover:#2a2a2a; --border-done:#1a1a1a;
      --accent:#7c6af7; --accent-light:#a89bf7; --accent-subtle:rgba(124,106,247,.07);
      --accent-rgb:124,106,247;
      --text:#e2e2e2; --text-dim:#555; --text-muted:#2a2a2a;
      --cb-border:#2c2c2c; --cb-border-hover:#444;
      --dot-past:#3a3270; --dot-empty-bg:#272727; --dot-empty-border:#333;
      --toolbar-hover:#1a1a1a; --modal-bg:#181818; --modal-border:#2a2a2a;
      --input-bg:#111; --input-border:#2a2a2a; --ripple-color:rgba(124,106,247,.35);
      --stat-bg:#131313; --stat-border:#1c1c1c;
    }
    :root[data-theme="light"] {
      --bg:#f5f7fa; --surface:#fff; --surface-done:#f0f0f5;
      --border:#e8eaed; --border-hover:#d0d3d8; --border-done:#e2e2e8;
      --accent:#6c5ce7; --accent-light:#a29bfe; --accent-subtle:rgba(108,92,231,.07);
      --accent-rgb:108,92,231;
      --text:#1a1a2e; --text-dim:#8888aa; --text-muted:#ccc;
      --cb-border:#d0d0e0; --cb-border-hover:#aaa;
      --dot-past:#b4acf5; --dot-empty-bg:#ebebf5; --dot-empty-border:#d0d0e0;
      --toolbar-hover:#ebebeb; --modal-bg:#fff; --modal-border:#e8eaed;
      --input-bg:#f5f5fa; --input-border:#ddd; --ripple-color:rgba(108,92,231,.3);
      --stat-bg:#fff; --stat-border:#e8eaed;
    }
    :root[data-theme="white"] {
      --bg:#ffffff; --surface:#ffffff; --surface-done:#fafafa;
      --border:#e5e5e5; --border-hover:#d0d0d0; --border-done:#ebebeb;
      --accent:#171717; --accent-light:#444; --accent-subtle:rgba(0,0,0,.04);
      --accent-rgb:23,23,23;
      --text:#171717; --text-dim:#737373; --text-muted:#d4d4d4;
      --cb-border:#d4d4d4; --cb-border-hover:#a3a3a3;
      --dot-past:#a3a3a3; --dot-empty-bg:#f5f5f5; --dot-empty-border:#e5e5e5;
      --toolbar-hover:#f5f5f5; --modal-bg:#fff; --modal-border:#e5e5e5;
      --input-bg:#fafafa; --input-border:#e5e5e5; --ripple-color:rgba(0,0,0,.1);
      --stat-bg:#fafafa; --stat-border:#e5e5e5;
    }
    :root[data-theme="github"] {
      --bg:#0d1117; --surface:#161b22; --surface-done:#0d1117;
      --border:#30363d; --border-hover:#484f58; --border-done:#21262d;
      --accent:#238636; --accent-light:#3fb950; --accent-subtle:rgba(35,134,54,.08);
      --accent-rgb:35,134,54;
      --text:#c9d1d9; --text-dim:#6e7681; --text-muted:#21262d;
      --cb-border:#30363d; --cb-border-hover:#484f58;
      --dot-past:#196c2e; --dot-empty-bg:#161b22; --dot-empty-border:#30363d;
      --toolbar-hover:#21262d; --modal-bg:#161b22; --modal-border:#30363d;
      --input-bg:#0d1117; --input-border:#30363d; --ripple-color:rgba(35,134,54,.35);
      --stat-bg:#161b22; --stat-border:#30363d;
    }
    :root[data-theme="classic"] {
      --bg:#1a1a2e; --surface:#16213e; --surface-done:#111827;
      --border:#0f3460; --border-hover:#1a5276; --border-done:#0d2a4a;
      --accent:#e94560; --accent-light:#ff6b81; --accent-subtle:rgba(233,69,96,.08);
      --accent-rgb:233,69,96;
      --text:#eaeaea; --text-dim:#8892a4; --text-muted:#1a3a5c;
      --cb-border:#0f3460; --cb-border-hover:#1a5276;
      --dot-past:#7b2a3e; --dot-empty-bg:#111827; --dot-empty-border:#0f3460;
      --toolbar-hover:#0f3460; --modal-bg:#16213e; --modal-border:#0f3460;
      --input-bg:#1a1a2e; --input-border:#0f3460; --ripple-color:rgba(233,69,96,.35);
      --stat-bg:#16213e; --stat-border:#0f3460;
    }

    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:56px 16px 64px; transition:background .3s,color .3s;
    }

    /* ── Toolbar ── */
    .toolbar { position:fixed; top:14px; right:18px; display:flex; align-items:center; gap:2px; z-index:200; }
    .toolbar-btn {
      height:34px; min-width:34px; border-radius:10px; border:none; background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      padding:0 7px; transition:background .18s,color .18s; text-decoration:none; flex-shrink:0;
    }
    .toolbar-btn:hover { background:var(--toolbar-hover); color:var(--text); }
    .toolbar-btn svg { width:17px; height:17px; fill:currentColor; }

    /* ── Shared picker wrapper ── */
    .picker-wrap { position:relative; }
    .picker-menu {
      position:absolute; top:calc(100% + 8px); right:0; background:var(--modal-bg);
      border:1px solid var(--modal-border); border-radius:12px; padding:5px;
      opacity:0; transform:translateY(-6px) scale(.96); pointer-events:none;
      transition:opacity .16s,transform .16s; z-index:300; box-shadow:0 8px 24px rgba(0,0,0,.25);
    }
    .picker-menu.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .picker-opt {
      display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px;
      border-radius:8px; border:none; background:transparent; color:var(--text);
      font-size:.8rem; font-family:inherit; cursor:pointer; text-align:left;
      transition:background .14s; letter-spacing:.02em; white-space:nowrap;
      text-decoration:none;
    }
    .picker-opt:hover { background:var(--toolbar-hover); }
    .picker-opt.active { color:var(--accent); }

    /* ── Theme dot ── */
    .theme-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ── Lang button & menu ── */
    .lang-btn { font-size:.72rem; font-weight:700; letter-spacing:.04em; }
    .lang-short { width:22px; text-align:center; font-weight:700; font-size:.78rem; color:var(--accent); flex-shrink:0; }
    .lang-name  { font-size:.8rem; }

    /* ── Toast ── */
    .toast {
      position:fixed; top:20px; left:50%;
      transform:translateX(-50%) translateY(-120px);
      background:var(--modal-bg); border:1px solid var(--modal-border);
      border-radius:18px; padding:14px 20px;
      display:flex; align-items:center; gap:12px;
      z-index:600; transition:transform .45s cubic-bezier(.34,1.56,.64,1);
      box-shadow:0 12px 40px rgba(0,0,0,.35); min-width:240px; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast-emoji { font-size:1.8rem; line-height:1; }
    .toast-title { font-size:.9rem; font-weight:600; color:var(--text); }
    .toast-sub   { font-size:.74rem; color:var(--text-dim); margin-top:2px; }

    /* ── Header ── */
    header { text-align:center; margin-bottom:32px; }
    .title    { font-size:1.1rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--text); margin-bottom:6px; }
    .subtitle { font-size:.8rem; color:var(--text-dim); letter-spacing:.04em; }

    /* ── Progress ── */
    .progress-section { width:100%; max-width:500px; margin-bottom:16px; }
    .progress-meta { display:flex; justify-content:space-between; font-size:.72rem; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
    .progress-track { height:2px; background:var(--border); border-radius:1px; overflow:hidden; }
    .progress-fill  { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-light)); border-radius:1px; transition:width .5s cubic-bezier(.22,1,.36,1); width:0%; }

    /* ── Stats row ── */
    .stats-row { display:flex; margin-top:14px; background:var(--stat-bg); border:1px solid var(--stat-border); border-radius:14px; overflow:hidden; }
    .stat-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 6px; gap:2px; }
    .stat-item + .stat-item { border-left:1px solid var(--stat-border); }
    .stat-icon  { font-size:.95rem; line-height:1; }
    .stat-value { font-size:.88rem; font-weight:700; color:var(--text); line-height:1.1; }
    .stat-label { font-size:.6rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }

    /* ── H bar ── */
    .h-track { height:2px; background:var(--border); border-radius:1px; overflow:hidden; margin-top:10px; }
    .h-fill  { height:100%; background:linear-gradient(90deg,#f0c040,#ffd700); border-radius:1px; transition:width .6s cubic-bezier(.22,1,.36,1); width:0%; }
    .h-meta  { display:flex; justify-content:space-between; margin-top:4px; font-size:.64rem; color:var(--text-dim); letter-spacing:.04em; font-variant-numeric:tabular-nums; }

    /* ── Recovery banner ── */
    .recovery-banner {
      width:100%; max-width:500px;
      background:rgba(255,155,30,.07); border:1px solid rgba(255,155,30,.2);
      border-radius:13px; padding:11px 14px;
      display:flex; align-items:center; gap:10px; margin-bottom:10px;
      opacity:0; transform:translateY(-8px); pointer-events:none;
      transition:opacity .3s,transform .3s;
    }
    .recovery-banner.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .recovery-icon { font-size:1.15rem; flex-shrink:0; }
    .recovery-text { flex:1; display:flex; flex-direction:column; gap:1px; }
    .recovery-msg  { font-size:.8rem; color:#ffaa30; font-weight:500; }
    .recovery-sub  { font-size:.68rem; color:var(--text-dim); }
    .recovery-close { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1.1rem; padding:4px; line-height:1; transition:color .15s; }
    .recovery-close:hover { color:var(--text); }

    /* ── Habit list ── */
    .habits { width:100%; max-width:500px; display:flex; flex-direction:column; gap:10px; }

    /* ── Habit card ── */
    .habit-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:18px; padding:18px 14px 18px 12px;
      display:flex; align-items:center; gap:10px;
      transition:border-color .25s,background .25s; cursor:default; position:relative;
    }
    .habit-card:hover         { border-color:var(--border-hover); }
    .habit-card.done          { background:var(--surface-done); border-color:var(--border-done); }
    .habit-card.missed-pulse  { border-color:rgba(255,155,30,.25); }
    @keyframes card-pop { 0%{transform:scale(1)} 40%{transform:scale(1.025)} 70%{transform:scale(.992)} 100%{transform:scale(1)} }
    .habit-card.popping { animation:card-pop .35s cubic-bezier(.34,1.56,.64,1) forwards; }

    /* ── Drag handle & reorder ── */
    .drag-handle {
      flex-shrink:0; width:18px; align-self:stretch;
      display:flex; align-items:center; justify-content:center;
      color:var(--text-dim); cursor:grab; touch-action:none;
      opacity:.32; transition:opacity .2s,color .2s; margin-right:-2px;
      -webkit-user-select:none; user-select:none;
    }
    .habit-card:hover .drag-handle { opacity:.5; }
    .drag-handle:hover { opacity:.85; }
    .drag-handle:active { cursor:grabbing; }
    .drag-handle svg { width:13px; height:13px; fill:currentColor; pointer-events:none; }
    .habit-card.dragging {
      opacity:.92; box-shadow:0 12px 32px rgba(0,0,0,.18);
      border-color:var(--accent); position:relative; z-index:50;
      cursor:grabbing; -webkit-user-select:none; user-select:none;
    }
    .habit-card.drag-settling { transition:box-shadow .2s,border-color .2s; }

    /* ── Checkbox ── */
    .cb-wrap { flex-shrink:0; position:relative; width:30px; height:30px; cursor:pointer; }
    .cb-wrap input { position:absolute; opacity:0; inset:0; cursor:pointer; z-index:1; margin:0; }
    .cb-face {
      width:30px; height:30px; border-radius:9px; border:1.5px solid var(--cb-border);
      background:transparent; display:flex; align-items:center; justify-content:center;
      transition:background .22s cubic-bezier(.34,1.56,.64,1),border-color .22s,transform .22s cubic-bezier(.34,1.56,.64,1);
      position:relative; overflow:hidden;
    }
    .cb-wrap:hover .cb-face { border-color:var(--cb-border-hover); }
    .cb-wrap input:checked ~ .cb-face { background:var(--accent); border-color:var(--accent); transform:scale(1.12); }
    .check-icon { opacity:0; transform:scale(.4) rotate(-20deg); transition:opacity .18s ease,transform .25s cubic-bezier(.34,1.56,.64,1); }
    .cb-wrap input:checked ~ .cb-face .check-icon { opacity:1; transform:scale(1) rotate(0deg); }
    .ripple { position:absolute; inset:-50%; border-radius:50%; background:var(--ripple-color); transform:scale(0); animation:ripple-out .55s ease-out forwards; pointer-events:none; }
    @keyframes ripple-out { to { transform:scale(2.5); opacity:0; } }

    /* ── Habit info ── */
    .habit-info { flex:1; min-width:0; }
    .habit-name  { font-size:.92rem; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .3s; }
    .habit-card.done .habit-name { color:var(--text-dim); }
    .habit-streak-label { font-size:.72rem; color:var(--text-dim); margin-top:3px; display:flex; align-items:center; gap:4px; transition:color .3s; letter-spacing:.02em; flex-wrap:wrap; }
    .habit-card.done .habit-streak-label { color:var(--accent); }
    .habit-time-label { font-size:.68rem; color:var(--text-dim); margin-top:2px; opacity:.6; }

    /* ── Streak badge ── */
    .streak-badge { display:inline-flex; align-items:center; font-size:.62rem; padding:1px 6px; border-radius:5px; font-weight:600; letter-spacing:.02em; animation:badge-pop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes badge-pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
    .streak-badge.s3   { background:rgba(107,203,119,.15); color:#6bcb77; }
    .streak-badge.s7   { background:rgba(255,165,0,.15);   color:#ffa020; }
    .streak-badge.s14  { background:rgba(255,215,0,.15);   color:#ffd700; }
    .streak-badge.s30  { background:rgba(100,216,255,.15); color:#64d8ff; }
    .streak-badge.s100 { background:rgba(255,215,0,.2); color:#ffd700; border:1px solid rgba(255,215,0,.3); }

    /* ── Missed label ── */
    .missed-label { font-size:.66rem; color:#ffa020; margin-top:3px; display:flex; align-items:center; gap:4px; }

    /* ── 7-day dots ── */
    .week-dots { display:flex; gap:5px; flex-shrink:0; }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--border); transition:background .3s,transform .3s; }
    .dot.past       { background:var(--dot-past); }
    .dot.today-done { background:var(--accent); transform:scale(1.3); }
    .dot.today-empty { background:var(--dot-empty-bg); border:1px solid var(--dot-empty-border); }

    /* ── Settings ── */
    .settings-wrap { position:relative; flex-shrink:0; }
    .settings-btn {
      width:28px; height:28px; border-radius:8px; border:none; background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .18s,background .18s,color .18s;
    }
    .settings-btn svg { width:15px; height:15px; fill:currentColor; pointer-events:none; }
    .habit-card:hover .settings-btn { opacity:1; }
    .settings-btn:hover { background:var(--border-hover); color:var(--text); }
    .settings-pop {
      position:absolute; right:0; top:calc(100% + 6px); background:var(--modal-bg);
      border:1px solid var(--modal-border); border-radius:12px; padding:6px;
      min-width:200px; z-index:100; opacity:0; transform:translateY(-4px) scale(.97);
      pointer-events:none; transition:opacity .15s,transform .15s;
      box-shadow:0 8px 24px rgba(0,0,0,.2);
    }
    .settings-pop.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .settings-section { padding:6px 8px 4px; }
    .settings-label { font-size:.66rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px; }
    .time-row { display:flex; align-items:center; gap:5px; }
    .time-row span { color:var(--text-dim); font-size:.78rem; }
    .time-input { background:var(--input-bg); border:1px solid var(--input-border); border-radius:7px; color:var(--text); font-size:.74rem; padding:4px 6px; width:76px; outline:none; font-family:inherit; transition:border-color .15s; }
    .time-input:focus { border-color:var(--accent); }
    .name-input { width:100%; background:var(--input-bg); border:1px solid var(--input-border); border-radius:7px; color:var(--text); font-size:.78rem; padding:6px 8px; outline:none; font-family:inherit; transition:border-color .15s; }
    .name-input:focus { border-color:var(--accent); }
    .settings-divider { height:1px; background:var(--border); margin:6px 0; }
    .settings-action { width:100%; padding:7px 10px; border-radius:8px; border:none; background:transparent; font-size:.8rem; cursor:pointer; text-align:left; transition:background .14s; font-family:inherit; display:flex; align-items:center; gap:7px; }
    .settings-delete { color:#e05050; }
    .settings-delete:hover { background:rgba(224,80,80,.1); }
    .settings-freeze { color:#64d8ff; }
    .settings-freeze:hover { background:rgba(100,216,255,.1); }

    /* ── Add button ── */
    .add-btn {
      margin-top:16px; width:100%; max-width:500px; height:48px;
      border-radius:14px; border:1.5px dashed var(--border-hover); background:transparent;
      color:var(--text-dim); cursor:pointer; transition:border-color .2s,color .2s,background .2s;
      display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit;
    }
    .add-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-subtle); }
    .add-plus  { font-size:1.3rem; line-height:1; }
    .add-label { font-size:.76rem; letter-spacing:.07em; text-transform:uppercase; }

    /* ── Floating H ── */
    .h-float { position:fixed; font-size:.76rem; font-weight:700; color:#ffd700; pointer-events:none; z-index:700; white-space:nowrap; animation:h-rise 1.1s ease-out forwards; text-shadow:0 1px 4px rgba(0,0,0,.5); }
    @keyframes h-rise { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-44px)} }

    /* ── Modal ── */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:400; padding:16px; opacity:0; transition:opacity .2s; pointer-events:none; }
    .modal-backdrop.open { opacity:1; pointer-events:auto; }
    .modal { background:var(--modal-bg); border:1px solid var(--modal-border); border-radius:20px; padding:24px; width:100%; max-width:360px; transform:translateY(10px) scale(.97); transition:transform .2s; box-shadow:0 16px 48px rgba(0,0,0,.3); }
    .modal-backdrop.open .modal { transform:translateY(0) scale(1); }
    .modal-title { font-size:.88rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text); margin-bottom:16px; }
    .modal-input { width:100%; background:var(--input-bg); border:1px solid var(--input-border); border-radius:10px; color:var(--text); font-size:.88rem; padding:10px 12px; outline:none; font-family:inherit; margin-bottom:12px; transition:border-color .18s; }
    .modal-input:focus { border-color:var(--accent); }
    .modal-time-row { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
    .modal-time-label { font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
    .modal-time-input { background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; color:var(--text); font-size:.8rem; padding:6px 8px; outline:none; font-family:inherit; transition:border-color .18s; }
    .modal-time-input:focus { border-color:var(--accent); }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
    .modal-btn { padding:8px 18px; border-radius:10px; border:none; font-size:.82rem; font-weight:500; cursor:pointer; font-family:inherit; transition:opacity .15s,background .15s; }
    .modal-btn.secondary { background:var(--border-hover); color:var(--text-dim); }
    .modal-btn.secondary:hover { opacity:.8; }
    .modal-btn.primary { background:var(--accent); color:#fff; }
    .modal-btn.primary:hover { opacity:.85; }

    /* ── Footer ── */
    footer { margin-top:52px; font-size:.68rem; color:var(--text-muted); letter-spacing:.06em; text-transform:uppercase; }

    /* ── User menu ── */
    .user-menu-header { padding:10px 12px 8px; }
    .user-menu-name   { font-size:.86rem; font-weight:600; color:var(--text); }
    .user-menu-email  { font-size:.72rem; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
    .user-avatar-btn  { font-size:1.05rem; }

    /* ── Page loading overlay ── */
    #page-loading {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      z-index:500; transition:opacity .3s;
    }
    .page-ring {
      width:32px; height:32px;
      border:2.5px solid rgba(124,106,247,.2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ══════════════════════════════════════════
       Calendar View
       ══════════════════════════════════════════ */
    .cal-view {
      position:fixed; inset:0; z-index:150;
      background:var(--bg);
      transform:translateX(100%);
      transition:transform .48s cubic-bezier(.22,1,.36,1);
      display:flex; flex-direction:column;
      will-change:transform;
    }
    .cal-view.open { transform:translateX(0); }

    /* ── Cal header (sticky) ── */
    .cal-header {
      position:sticky; top:0; z-index:10;
      background:var(--bg);
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px 12px;
      border-bottom:1px solid var(--border);
    }
    .cal-back-btn {
      width:36px; height:36px; border-radius:10px; border:none;
      background:transparent; color:var(--text-dim); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .18s,color .18s;
    }
    .cal-back-btn:hover { background:var(--toolbar-hover); color:var(--text); }
    .cal-back-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .cal-header-title { font-size:.9rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text); }
    .cal-header-right { width:36px; } /* spacer */

    /* ── Scrollable area ── */
    .cal-scroll {
      flex:1; overflow-y:auto; padding:24px 20px 80px;
      -webkit-overflow-scrolling:touch;
    }

    /* ── Month block ── */
    .cal-month { max-width:500px; margin:0 auto 48px; }

    .cal-month-title {
      font-size:1rem; font-weight:600; color:var(--text);
      letter-spacing:.04em; margin-bottom:14px;
      display:flex; align-items:baseline; gap:8px;
    }
    .cal-month-year { font-size:.78rem; color:var(--text-dim); font-weight:400; }

    /* ── Day labels ── */
    .cal-day-labels {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:4px; margin-bottom:6px;
    }
    .cal-day-label {
      text-align:center; font-size:.65rem; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:.04em; padding:2px 0;
    }

    /* ── Day grid ── */
    .cal-grid {
      display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    }

    /* ── Day cell ── */
    .cal-cell {
      position:relative; aspect-ratio:1; border-radius:10px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:default; overflow:hidden;
      background:var(--surface);
      transition:transform .15s, background .3s;
    }
    .cal-cell:not(.cal-empty):not(.cal-future):hover {
      transform:scale(1.08);
    }

    /* Color fill via ::before overlay */
    .cal-cell::before {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background:rgba(var(--accent-rgb),1);
      opacity:var(--fill-opacity,0);
      transition:opacity .3s;
      pointer-events:none;
    }

    .cal-cell.cal-empty { background:transparent; cursor:default; }
    .cal-cell.cal-empty::before { display:none; }

    .cal-cell.cal-future { opacity:.25; }
    .cal-cell.cal-future::before { display:none; }

    /* Today ring */
    .cal-cell.cal-today {
      box-shadow:0 0 0 2px var(--accent);
    }

    /* Day number */
    .cal-day-num {
      position:relative; z-index:1;
      font-size:.8rem; font-weight:500; color:var(--text-dim);
      line-height:1; transition:color .3s;
    }
    .cal-cell.cal-mid .cal-day-num  { color:var(--text); }
    .cal-cell.cal-high .cal-day-num { color:#fff; }
    .cal-cell.cal-today .cal-day-num { color:var(--text); font-weight:700; }
    .cal-cell.cal-today.cal-high .cal-day-num { color:#fff; }

    /* Perfect day marker */
    .cal-perfect-mark {
      position:absolute; z-index:2;
      top:3px; right:4px;
      font-size:.5rem; line-height:1;
      color:rgba(255,255,255,.9);
      pointer-events:none;
    }

    /* Completion count dots (bottom) */
    .cal-dots {
      position:absolute; bottom:4px; left:0; right:0;
      display:flex; justify-content:center; gap:2px; z-index:1;
    }
    .cal-dot {
      width:3px; height:3px; border-radius:50%;
      background:rgba(255,255,255,.5);
    }
    .cal-dot.dim { background:rgba(var(--accent-rgb),.4); }

    /* ── Legend ── */
    .cal-legend {
      max-width:500px; margin:0 auto 32px;
      display:flex; align-items:center; gap:10px;
      font-size:.66rem; color:var(--text-dim); letter-spacing:.04em;
    }
    .cal-legend-cells { display:flex; gap:3px; }
    .cal-legend-cell {
      width:14px; height:14px; border-radius:4px;
      background:var(--surface);
    }
    .cal-legend-cell::before {
      content:''; display:block; width:100%; height:100%; border-radius:inherit;
      background:rgba(var(--accent-rgb),1);
      opacity:var(--fill-opacity,0);
    }
    .cal-legend-labels { display:flex; justify-content:space-between; flex:1; }

    /* ── Login button (toolbar, guest mode) ── */
    .login-btn {
      font-size:.78rem; font-weight:600; letter-spacing:.03em;
      padding:0 14px !important; color:#fff !important;
      background:#0a0a0a !important; border-radius:8px !important;
    }
    :root[data-theme="light"] .login-btn { background:#111 !important; }

    /* ── User avatar initials ── */
    .user-avatar-initials {
      width:22px; height:22px; border-radius:50%;
      background:var(--accent); color:#fff;
      font-size:.68rem; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      text-transform:uppercase; line-height:1;
    }

    /* ── Login Modal ── */
    .lm-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      z-index:900; padding:16px;
      opacity:0; pointer-events:none;
      transition:opacity .2s;
    }
    .lm-overlay.open { opacity:1; pointer-events:auto; }
    .lm-card {
      background:#fff; border-radius:16px;
      width:100%; max-width:400px;
      padding:32px 28px 24px;
      box-shadow:0 24px 80px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.05);
      position:relative;
      transform:scale(.96) translateY(10px);
      transition:transform .22s cubic-bezier(.22,1,.36,1);
    }
    .lm-overlay.open .lm-card { transform:scale(1) translateY(0); }
    .lm-close {
      position:absolute; top:14px; right:14px;
      width:28px; height:28px; border-radius:50%;
      border:none; background:#f0f0f0; color:#666;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .15s;
    }
    .lm-close:hover { background:#e4e4e4; }
    .lm-brand { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
    .lm-brand-mark {
      width:34px; height:34px; border-radius:9px;
      background:linear-gradient(135deg,#7c6af7,#a89bf7);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; color:#fff;
      box-shadow:0 3px 10px rgba(124,106,247,.35);
    }
    .lm-brand-name { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#0a0a0a; }
    .lm-brand-sub  { font-size:.62rem; color:#999; margin-top:1px; }
    .lm-social { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
    .lm-social-btn {
      width:100%; height:44px; border-radius:10px;
      font-size:.84rem; font-weight:500; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      transition:opacity .15s, transform .1s; letter-spacing:.01em;
    }
    .lm-social-btn:hover { opacity:.88; transform:translateY(-1px); }
    .lm-social-btn:active { transform:translateY(0); }
    .lm-btn-google { background:#000; color:#fff; border:none; }
    .lm-btn-github { background:#fff; color:#0a0a0a; border:1.5px solid #d0d0d0; }
    .lm-divider {
      display:flex; align-items:center; gap:12px;
      margin:2px 0 18px; color:#bbb; font-size:.74rem;
    }
    .lm-divider::before, .lm-divider::after { content:''; flex:1; height:1px; background:#e8e8e8; }
    .lm-input {
      width:100%; height:44px;
      border:1.5px solid #e0e0e0; border-radius:10px;
      padding:0 14px; font-size:.9rem; font-family:inherit;
      outline:none; background:#fff; color:#0a0a0a;
      transition:border-color .18s, box-shadow .18s;
    }
    .lm-input:focus { border-color:#7c6af7; box-shadow:0 0 0 3px rgba(124,106,247,.1); }
    .lm-input::placeholder { color:#bbb; }
    .lm-continue-btn {
      width:100%; height:44px; margin-top:10px;
      border-radius:10px; border:none;
      background:#d0d0d0; color:#888;
      font-size:.84rem; font-weight:500; font-family:inherit;
      cursor:pointer; transition:background .18s, color .18s, transform .1s;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .lm-continue-btn.active { background:#000; color:#fff; cursor:pointer; }
    .lm-continue-btn.active:hover { opacity:.88; transform:translateY(-1px); }
    .lm-continue-btn:disabled { cursor:not-allowed; }
    .lm-step2 { display:none; }
    .lm-step2.visible { display:block; }
    .lm-back-btn {
      background:none; border:none; cursor:pointer;
      color:#888; font-size:.78rem; font-family:inherit;
      display:flex; align-items:center; gap:4px;
      margin-bottom:14px; padding:0; transition:color .15s;
    }
    .lm-back-btn:hover { color:#0a0a0a; }
    .lm-email-tag {
      font-size:.82rem; color:#444; margin-bottom:12px;
      padding:6px 10px; background:#f5f5f5; border-radius:6px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .lm-primary-btn {
      width:100%; height:44px; margin-top:10px;
      background:#000; color:#fff; border:none; border-radius:10px;
      font-size:.84rem; font-weight:500; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
      transition:opacity .15s, transform .1s;
    }
    .lm-primary-btn:hover:not(:disabled) { opacity:.88; transform:translateY(-1px); }
    .lm-primary-btn:disabled { opacity:.5; cursor:not-allowed; }
    .lm-signup-link {
      text-align:center; margin-top:12px;
      font-size:.76rem; color:#888;
    }
    .lm-signup-link button {
      background:none; border:none; cursor:pointer;
      color:#7c6af7; font-family:inherit; font-size:.76rem; font-weight:500;
      margin-left:4px; transition:opacity .15s;
    }
    .lm-signup-link button:hover { opacity:.75; }
    .lm-msg {
      font-size:.78rem; border-radius:8px; padding:8px 12px;
      margin-top:10px; display:none; align-items:flex-start; gap:8px;
    }
    .lm-msg.error { display:flex; background:#fff0f0; border:1px solid #fccaca; color:#c0392b; }
    .lm-msg.success { display:flex; background:#f0fff5; border:1px solid #a8e6bf; color:#27ae60; }
    .lm-msg.info { display:flex; background:#f5f0ff; border:1px solid #cbbdf7; color:#6c5ce7; }
    .lm-footer {
      margin-top:20px; padding-top:16px; border-top:1px solid #f0f0f0;
      font-size:.72rem; color:#bbb; text-align:center;
    }
    .lm-spinner {
      width:14px; height:14px; border-radius:50%;
      border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
      animation:spin .6s linear infinite; display:none; flex-shrink:0;
    }
    .lm-loading .lm-spinner { display:block; }
    .lm-loading .lm-btn-text { display:none; }
    @media (max-width:480px) {
      .lm-overlay { align-items:flex-end; padding:0; }
      .lm-card { border-radius:16px 16px 0 0; max-width:100%; padding:28px 20px 32px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
</head>
<body>

<!-- ── Calendar view ── -->
<div id="cal-view" class="cal-view" aria-hidden="true">
  <div class="cal-header">
    <button class="cal-back-btn" id="cal-back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="cal-header-title" id="cal-header-title">Calendar</span>
    <div class="cal-header-right"></div>
  </div>
  <div class="cal-scroll" id="cal-scroll">
    <!-- months built by JS -->
  </div>
</div>

<!-- Confetti canvas -->
<canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:1000;display:none"></canvas>

<!-- Toast -->
<div class="toast" id="notif-toast">
  <span class="toast-emoji" id="toast-emoji">🎉</span>
  <div>
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-sub"   id="toast-sub"></div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <!-- Theme picker -->
  <div class="picker-wrap" id="theme-picker-wrap">
    <button class="toolbar-btn" id="theme-btn" title="Theme" aria-label="Choose theme">
      <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </button>
    <div class="picker-menu" id="theme-menu">
      <button class="picker-opt" data-theme="white"><span class="theme-dot" style="background:#fff;border:1.5px solid #d4d4d4"></span>White</button>
      <button class="picker-opt" data-theme="dark"><span class="theme-dot" style="background:#7c6af7"></span>Dark</button>
      <button class="picker-opt" data-theme="light"><span class="theme-dot" style="background:#6c5ce7;opacity:.5"></span>Light</button>
      <button class="picker-opt" data-theme="github"><span class="theme-dot" style="background:#238636"></span>GitHub</button>
      <button class="picker-opt" data-theme="classic"><span class="theme-dot" style="background:#e94560"></span>Classic</button>
    </div>
  </div>

  <!-- Language picker -->
  <div class="picker-wrap" id="lang-picker-wrap">
    <button class="toolbar-btn lang-btn" id="lang-btn" title="Language" aria-label="Choose language">EN</button>
    <div class="picker-menu" id="lang-menu" style="min-width:160px">
      <button class="picker-opt" data-lang="en"><span class="lang-short">EN</span><span class="lang-name">English</span></button>
      <button class="picker-opt" data-lang="zh"><span class="lang-short">中</span><span class="lang-name">中文</span></button>
      <button class="picker-opt" data-lang="es"><span class="lang-short">ES</span><span class="lang-name">Español</span></button>
      <button class="picker-opt" data-lang="ko"><span class="lang-short">한</span><span class="lang-name">한국어</span></button>
      <button class="picker-opt" data-lang="ja"><span class="lang-short">日</span><span class="lang-name">日本語</span></button>
      <button class="picker-opt" data-lang="vi"><span class="lang-short">VI</span><span class="lang-name">Tiếng Việt</span></button>
      <button class="picker-opt" data-lang="th"><span class="lang-short">TH</span><span class="lang-name">ภาษาไทย</span></button>
    </div>
  </div>

  <!-- Calendar -->
  <button class="toolbar-btn" id="cal-open-btn" title="Calendar" aria-label="Open calendar">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5C3.9 3 3 3.9 3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zM9 14H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
  </button>

  <!-- GitHub -->
  <a class="toolbar-btn" href="https://github.com/Ghostwritten/Habit" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub repository">
    <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
  </a>

  <!-- Login button (guest mode) -->
  <button class="toolbar-btn login-btn" id="login-btn" style="display:none" title="Sign in">Login</button>

  <!-- User account -->
  <div class="picker-wrap" id="user-picker-wrap">
    <button class="toolbar-btn user-avatar-btn" id="user-btn" title="Account" aria-label="Account">
      <span id="user-avatar-display">😊</span>
    </button>
    <div class="picker-menu" id="user-menu" style="min-width:200px">
      <div class="user-menu-header">
        <div class="user-menu-name"  id="user-menu-name">—</div>
        <div class="user-menu-email" id="user-menu-email">—</div>
      </div>
      <div class="settings-divider"></div>
      <a class="picker-opt" id="profile-link" href="profile.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="opacity:.7">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span id="profile-link-label">My Profile</span>
      </a>
      <button class="picker-opt" id="sign-out-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="opacity:.7">
          <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
        </svg>
        Sign out
      </button>
    </div>
  </div>
</div>

<!-- Page loading overlay -->
<div id="page-loading"><div class="page-ring"></div></div>

<header>
  <div class="title" id="page-title">Daily Habits</div>
  <div class="subtitle" id="date-label"></div>
</header>

<div class="progress-section">
  <div class="progress-meta">
    <span id="label-today">Today</span>
    <span id="progress-text">0 / 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="stats-row">
    <div class="stat-item" title="Consecutive perfect days">
      <span class="stat-icon">🔥</span>
      <span class="stat-value" id="perfect-count">0</span>
      <span class="stat-label" id="label-perfect">Perfect</span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">⚡</span>
      <span class="stat-value" id="level-display">Lv.1</span>
      <span class="stat-label" id="level-title">Newcomer</span>
    </div>
    <div class="stat-item" title="Streak freeze tokens">
      <span class="stat-icon">❄️</span>
      <span class="stat-value" id="freeze-count">×0</span>
      <span class="stat-label" id="label-freeze">Freeze</span>
    </div>
  </div>
  <div class="h-track"><div class="h-fill" id="h-fill"></div></div>
  <div class="h-meta">
    <span id="h-text">0 H</span>
    <span id="h-next">→ 100 H</span>
  </div>
</div>

<!-- Recovery banner -->
<div class="recovery-banner" id="recovery-banner">
  <span class="recovery-icon">💫</span>
  <div class="recovery-text">
    <span class="recovery-msg" id="recovery-msg"></span>
    <span class="recovery-sub" id="recovery-sub"></span>
  </div>
  <button class="recovery-close" id="recovery-close">×</button>
</div>

<div class="habits" id="habits"></div>

<button class="add-btn" id="add-btn">
  <span class="add-plus">+</span>
  <span class="add-label" id="add-label">Add Habit</span>
</button>

<footer id="page-footer">data saved locally</footer>

<!-- Add habit modal -->
<div class="modal-backdrop" id="modal-backdrop">

// ── Supabase DB functions ─────────────────────────────────────────
async function _dbLoadHabits() {
  const { data } = await sb.from('habits').select('*').order('sort_order');
  return (data||[]).map(r => ({
    id:r.id, name:r.name,
    timeStart:r.time_start||undefined,
    timeEnd:r.time_end||undefined,
  }));
}

async function _dbSaveHabit(habit, order) {
  await sb.from('habits').upsert({
    id:habit.id, user_id:currentUser.id, name:habit.name,
    time_start:habit.timeStart||null, time_end:habit.timeEnd||null,
    sort_order:order,
  });
}

async function _dbDeleteHabit(id) {
  await sb.from('habits').delete().eq('id', id);
}

async function _dbLoadData() {
  const { data } = await sb.from('check_ins').select('habit_id,check_date');
  const r = {};
  (data||[]).forEach(row => {
    if(!r[row.habit_id]) r[row.habit_id] = { dates:[] };
    r[row.habit_id].dates.push(row.check_date);
  });
  return r;
}

async function _dbToggleCheckin(habitId, date, done) {
  if(done){
    await sb.from('check_ins').upsert(
      { user_id:currentUser.id, habit_id:habitId, check_date:date },
      { onConflict:'habit_id,check_date' }
    );
  } else {
    await sb.from('check_ins').delete()
      .eq('habit_id', habitId).eq('check_date', date);
  }
}

async function _dbLoadMeta() {
  const { data } = await sb.from('user_meta')
    .select('*').eq('user_id', currentUser.id).single();
  return data
    ? { xp:data.xp, perfectDays:data.perfect_days||[], freezeTokens:data.freeze_tokens }
    : { xp:0, perfectDays:[], freezeTokens:0 };
}

async function _dbSaveMeta(m) {
  await sb.from('user_meta').upsert({
    user_id:currentUser.id,
    xp:m.xp, perfect_days:m.perfectDays, freeze_tokens:m.freezeTokens,
    updated_at:new Date().toISOString(),
  });

/* ════════════════════════════════════════════
   Date helpers
   ════════════════════════════════════════════ */
const TODAY = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
})();

function prevDay(s){
  const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function last7(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()-i);
    days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return days;
}

function calcStreak(dates){
  const set=new Set(dates);
  let cursor=set.has(TODAY)?TODAY:prevDay(TODAY);
  if(!set.has(cursor))return 0;
  let n=0; while(set.has(cursor)){n++;cursor=prevDay(cursor);} return n;
}

function calcPerfectStreak(pd){
  const set=new Set(pd);
  let cursor=set.has(TODAY)?TODAY:prevDay(TODAY);
  if(!set.has(cursor))return 0;
  let n=0; while(set.has(cursor)){n++;cursor=prevDay(cursor);} return n;
}

/* ════════════════════════════════════════════
   Level / H
   ════════════════════════════════════════════ */
function getLevel(xp){
  let idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i]){idx=i;break;} }
  return idx;
}

function getXpProgress(xp){
  const idx=getLevel(xp), cur=LEVELS[idx], nxt=LEVELS[idx+1];
  if(!nxt) return 100;
  return Math.min(100,((xp-cur)/(nxt-cur))*100);
}

function updateStats(){
  const meta=loadMeta(), lvIdx=getLevel(meta.xp), ps=calcPerfectStreak(meta.perfectDays);
  const levelTitles = (I18N[currentLang]||I18N.en).levels;
  document.getElementById('perfect-count').textContent  = ps;
  document.getElementById('level-display').textContent  = `Lv.${lvIdx+1}`;
  document.getElementById('level-title').textContent    = levelTitles[lvIdx] || levelTitles[0];
  document.getElementById('freeze-count').textContent   = `×${meta.freezeTokens}`;
  document.getElementById('h-fill').style.width        = getXpProgress(meta.xp)+'%';
  document.getElementById('h-text').textContent        = `${meta.xp.toLocaleString()} H`;
  const nxt=LEVELS[lvIdx+1];
  document.getElementById('h-next').textContent = nxt ? t('nextH',nxt) : t('maxLevel');
}

/* ════════════════════════════════════════════
   Confetti
   ════════════════════════════════════════════ */
function launchConfetti(){
  const palettes={
    white:['#171717','#525252','#f59e0b','#10b981','#ef4444','#3b82f6','#8b5cf6'],
    dark:['#7c6af7','#a89bf7','#ffd93d','#6bcb77','#ff6b6b','#4d96ff','#fff'],
    light:['#6c5ce7','#a29bfe','#fdcb6e','#00b894','#e17055','#0984e3'],
    github:['#238636','#3fb950','#ffd700','#58a6ff','#d2a8ff','#ff7b72','#fff'],
    classic:['#e94560','#ff6b81','#ffd700','#4cc9f0','#c77dff','#eee'],
  };
  const colors=palettes[currentTheme]||palettes.dark;
  const canvas=document.getElementById('confetti-canvas');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  const particles=Array.from({length:170},()=>({
    x:Math.random()*canvas.width, y:-10-Math.random()*180,
    color:colors[Math.floor(Math.random()*colors.length)],
    speed:Math.random()*4+2, swing:Math.random()*2.5,
    swingSpeed:Math.random()*.04+.01, angle:Math.random()*Math.PI*2,
    rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-.5)*.15,
    w:Math.random()*9+4, h:Math.random()*5+3,
    shape:Math.random()>.4?'rect':'circle', opacity:1,
  }));
  let frame=0;
  (function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.opacity<=0)return;
      p.y+=p.speed; p.x+=Math.sin(p.angle)*p.swing; p.angle+=p.swingSpeed; p.rot+=p.rotSpeed;
      if(frame>110) p.opacity=Math.max(0,p.opacity-.013);
      if(p.y>canvas.height) p.opacity=0;
      alive=true;
      ctx.save(); ctx.globalAlpha=p.opacity; ctx.fillStyle=p.color;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.shape==='rect') ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      else{ ctx.beginPath(); ctx.ellipse(0,0,p.w/2,p.h/2,0,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    frame++;
    if(alive) requestAnimationFrame(animate); else canvas.style.display='none';
  })();
}

/* ════════════════════════════════════════════
   Perfect day
   ════════════════════════════════════════════ */
let perfectCelebrated=false;

function checkPerfectDay(){
  if(!habits.length) return;
  const data=loadData();
  if(!habits.every(h=>(data[h.id]?.dates||[]).includes(TODAY))) return;
  if(perfectCelebrated) return;
  perfectCelebrated=true;

  const meta=loadMeta(), prevXP=meta.xp, alreadyCounted=meta.perfectDays.includes(TODAY);
  if(!alreadyCounted){
    meta.perfectDays.push(TODAY);
    meta.xp+=50;
    const ps=calcPerfectStreak(meta.perfectDays);
    if(ps>0&&ps%7===0){
      meta.freezeTokens++;
      setTimeout(()=>showNotif('❄️',t('freezeEarned'),t('freezeEarnedSub',ps,meta.freezeTokens),'#64d8ff'),2200);
    }
    saveMeta(meta);
    const prevLvIdx=getLevel(prevXP), newLvIdx=getLevel(meta.xp);
    if(newLvIdx>prevLvIdx){
      const titles=(I18N[currentLang]||I18N.en).levels;
      setTimeout(()=>showNotif('⚡',t('levelUp'),`Lv.${newLvIdx+1} ${titles[newLvIdx]}`,'#ffd700',4000),1600);
    }
  }
  launchConfetti();
  showNotif('🎉',t('perfectDay'),t('perfectDaySub',!alreadyCounted),'var(--accent)',4500);
  updateStats();
}

/* ════════════════════════════════════════════
   Drag-to-reorder (Pointer Events — mouse + touch)
   ════════════════════════════════════════════ */
let _drag=null;

function attachDragHandle(handle, card){
  handle.addEventListener('pointerdown', e=>{
    if(habits.length<2) return;          // nothing to reorder
    e.preventDefault(); e.stopPropagation();
    closeAllPops();
    const container=document.getElementById('habits');
    _drag={ card, container };
    card.classList.add('dragging');
    // Listen on document (not handle): the card+handle move in the DOM during
    // reorder, which would break pointer capture on the handle itself.
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
  });
}

function onDragMove(e){
  if(!_drag) return;
  const container=_drag.container, card=_drag.card, y=e.clientY;
  const others=[...container.querySelectorAll('.habit-card:not(.dragging)')];
  const next=others.find(s=>{
    const r=s.getBoundingClientRect();
    return y < r.top + r.height/2;
  })||null;

  if(card.nextElementSibling===next) return;   // no positional change → skip

  // FLIP: record each card's top before the move…
  const all=[...container.querySelectorAll('.habit-card')];
  const firstTop=new Map(all.map(c=>[c, c.getBoundingClientRect().top]));

  container.insertBefore(card, next);

  // …then invert + play the displaced siblings so they glide into place.
  all.forEach(c=>{
    if(c===card) return;
    const delta=firstTop.get(c)-c.getBoundingClientRect().top;
    if(!delta) return;
    gsap.fromTo(c, {y: delta}, {y: 0, duration: 0.34, ease: 'power2.out', overwrite: 'auto'});
  });
}

function onDragEnd(e){
  if(!_drag) return;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  const card=_drag.card, container=_drag.container;
  card.classList.remove('dragging'); card.classList.add('drag-settling');
  setTimeout(()=>card.classList.remove('drag-settling'),220);
  // Kill any in-flight GSAP FLIP tweens on siblings
  container.querySelectorAll('.habit-card').forEach(c=>{
    gsap.killTweensOf(c, 'y');
    gsap.set(c, {clearProps: 'y'});
  });

  // Rebuild habits[] to match new DOM order
  const order=[...container.querySelectorAll('.habit-card')].map(c=>c.dataset.habitId);
  const before=habits.map(h=>h.id).join(',');
  habits.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  _drag=null;

  if(habits.map(h=>h.id).join(',')===before) return;   // no change
  saveHabits(habits);
  if(currentUser) habits.forEach((h,i)=>_dbSaveHabit(h,i).catch(console.error));
}

/* ════════════════════════════════════════════
   GSAP Card Animations
   ════════════════════════════════════════════ */
const _prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function wireCardGSAP(card) {
  if (_prefersReduced) return;
  card.addEventListener('mousemove', _onCardMove);
  card.addEventListener('mouseleave', _onCardLeave);
}

function _onCardMove(e) {
  if (_drag) return;   // no tilt while reordering
  const card = e.currentTarget;
  const r    = card.getBoundingClientRect();
  // Normalise -1 → +1 relative to card centre
  const dx   = ((e.clientX - r.left) / r.width  - 0.5) * 2;
  const dy   = ((e.clientY - r.top)  / r.height - 0.5) * 2;
  gsap.to(card, {
    rotationY:         dx *  7,   // ±7 ° left/right
    rotationX:        -dy *  4,   // ±4 ° up/down
    scale:             1.018,
    transformPerspective: 900,
    duration: 0.35, ease: 'power2.out', overwrite: 'auto'
  });
}

function _onCardLeave(e) {
  if (_drag) return;
  gsap.to(e.currentTarget, {
    rotationY: 0, rotationX: 0, scale: 1,
    transformPerspective: 900,
    duration: 0.5, ease: 'power3.out', overwrite: 'auto'
  });
}

  if(habits.length===0){
    container.innerHTML=`<div style="text-align:center;padding:64px 0 32px;color:var(--text-dim);">

    attachDragHandle(handle, card);

    const cbWrap=document.createElement('label'); cbWrap.className='cb-wrap';
    cbWrap.innerHTML=`<input type="checkbox" ${checked?'checked':''}/>
      <div class="cb-face"><svg class="check-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7.5L5.5 11L12 3" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

    /* Info */

        else habits[idx].timeEnd=ti.value;
        saveHabits(habits); refreshInfo(habits[idx]);
        if(currentUser) _dbSaveHabit(habits[idx], idx).catch(console.error);
      });
    });

    const nameInput=pop.querySelector('.name-input');
    nameInput.addEventListener('click',e=>e.stopPropagation());
    nameInput.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') nameInput.blur(); });
    const commitName=()=>{
      const idx=habits.findIndex(h=>h.id===habit.id); if(idx===-1)return;
      const newName=nameInput.value.trim();
      if(!newName || newName===habits[idx].name){ nameInput.value=habits[idx].name; return; }
      habits[idx].name=newName;
      saveHabits(habits);
      refreshInfo(habit);
      if(currentUser) _dbSaveHabit(habits[idx], idx).catch(console.error);
    };
    nameInput.addEventListener('change',e=>{ e.stopPropagation(); commitName(); });
    nameInput.addEventListener('blur',commitName);

    if(canFreeze){
      pop.querySelector('.settings-freeze').addEventListener('click',e=>{
        e.stopPropagation();
        const storage=loadData(), hd=storage[habit.id]||{dates:[]};
        const yest=prevDay(TODAY);
        if(!hd.dates.includes(yest)) hd.dates.push(yest);
        storage[habit.id]=hd; saveData(storage);
        const m2=loadMeta(); m2.freezeTokens--; saveMeta(m2);
        closeAllPops();
        showNotif('❄️',t('freezeUsed'),t('freezeUsedSub',m2.freezeTokens),'#64d8ff',3000);
        build(); updateStats();
      });
    }

    pop.querySelector('.settings-delete').addEventListener('click',async e=>{
      e.stopPropagation();
      const idx=habits.findIndex(h=>h.id===habit.id);
      if(idx!==-1) habits.splice(idx,1);
      delete _habitDataCache[habit.id];
      saveHabits(habits); saveData(_habitDataCache);
      if(currentUser) _dbDeleteHabit(habit.id).catch(console.error);
      closeAllPops(); build();
    });

    sb.addEventListener('click',e=>{
      e.stopPropagation();
      if(openPop===pop) closeAllPops();
      else{closeAll();pop.classList.add('open');openPop=pop;}
    });
    pop.addEventListener('click',e=>e.stopPropagation());
    sw.appendChild(sb); sw.appendChild(pop);

    card.appendChild(handle);
    card.appendChild(cbWrap); card.appendChild(info);
    card.appendChild(dots);   card.appendChild(sw);
    container.appendChild(card);
    wireCardGSAP(card);

    /* Checkbox interaction */
    input.addEventListener('change', async ()=>{
      const hd = _habitDataCache[habit.id] || {dates:[]};
      if(input.checked){
        if(!hd.dates.includes(TODAY)) hd.dates.push(TODAY);
        _habitDataCache[habit.id] = hd;
        if(!currentUser) localStorage.setItem('habitData', JSON.stringify(_habitDataCache));
        card.classList.add('done'); card.classList.remove('missed-pulse');

        const rip=document.createElement('span'); rip.className='ripple';
        cbFace.appendChild(rip); rip.addEventListener('animationend',()=>rip.remove());
        gsap.timeline({defaults:{overwrite:'auto'}})
          .to(card, {scale:1.03, duration:0.13, ease:'power2.out'})
          .to(card, {scale:1,    duration:0.55, ease:'elastic.out(1,0.5)'});

        if(currentUser) _dbToggleCheckin(habit.id, TODAY, true).catch(console.error);

        const m=loadMeta(), prevXP=m.xp, prevLvIdx=getLevel(prevXP);
        let earned=10, milestoneDay=0, milestoneXP=0;
        const ns=calcStreak(hd.dates);
        if(ns===100){earned+=500;milestoneDay=100;milestoneXP=500;}
        else if(ns===30){earned+=100;milestoneDay=30;milestoneXP=100;}
        else if(ns===14){earned+=50;milestoneDay=14;milestoneXP=50;}
        else if(ns===7){earned+=30;milestoneDay=7;milestoneXP=30;}
        else if(ns===3){earned+=10;milestoneDay=3;milestoneXP=10;}
        m.xp+=earned; saveMeta(m);

        showFloatingH(earned,cbWrap);
        if(milestoneDay) setTimeout(()=>showNotif('🏅',t('milestone'),t('milestoneMsg',milestoneDay,milestoneXP),'#ffd700',4000),400);

        const newLvIdx=getLevel(m.xp);
        if(newLvIdx>prevLvIdx){
          const titles=(I18N[currentLang]||I18N.en).levels;
          setTimeout(()=>showNotif('⚡',t('levelUp'),`Lv.${newLvIdx+1} ${titles[newLvIdx]}`,'#ffd700',4000),900);
        }
      } else {
        hd.dates=hd.dates.filter(d=>d!==TODAY);
        _habitDataCache[habit.id]=hd;
        if(!currentUser) localStorage.setItem('habitData', JSON.stringify(_habitDataCache));
        card.classList.remove('done'); perfectCelebrated=false;
        if(currentUser) _dbToggleCheckin(habit.id, TODAY, false).catch(console.error);
      }

      refreshInfo(habit); renderDots(hd.dates,dots);
      updateProgress(); updateStats();
      setTimeout(checkPerfectDay,350);
    });
  });

  updateProgress(); updateStats(); checkRecovery();

  // GSAP staggered entrance
  if (!_prefersReduced) {
    gsap.from(container.querySelectorAll('.habit-card'), {
      y: 14, opacity: 0, duration: 0.38,
      stagger: 0.06, ease: 'power2.out', clearProps: 'all'
    });
  }
}

/* ════════════════════════════════════════════
   Calendar
   ════════════════════════════════════════════ */

function openCalendar(){
  closeAll();
  const view = document.getElementById('cal-view');
  view.classList.add('open');
  view.removeAttribute('aria-hidden');
  buildCalendar();
  // Scroll to current month after render
  setTimeout(()=>{
    const scroll = document.getElementById('cal-scroll');
    const cur = document.getElementById('cal-current-month');
    if(cur && scroll) scroll.scrollTop = cur.offsetTop - 20;
  }, 80);
}

function closeCalendar(){
  const view = document.getElementById('cal-view');
  view.classList.remove('open');
  view.setAttribute('aria-hidden','true');
}

function buildCalendar(){
  const locale  = LANGS[currentLang].locale;
  const data    = loadData();
  const total   = habits.length;
  const scroll  = document.getElementById('cal-scroll');
  scroll.innerHTML = '';

  // Build a date → count map across all habits
  const countMap = {}; // 'YYYY-MM-DD' → number of habits done
  habits.forEach(h => {
    (data[h.id]?.dates || []).forEach(d => {
      countMap[d] = (countMap[d] || 0) + 1;
    });
  });

  // Determine range: earliest recorded date or 12 months ago → today
  const todayD   = new Date(TODAY + 'T00:00:00');
  const cutoff   = new Date(todayD);
  cutoff.setMonth(cutoff.getMonth() - 11);
  cutoff.setDate(1);

  let earliest = new Date(todayD);
  Object.keys(countMap).forEach(d => {
    const dd = new Date(d + 'T00:00:00');
    if(dd < earliest) earliest = dd;
  });
  earliest.setDate(1);

  const startMonth = new Date(Math.min(earliest.getTime(), cutoff.getTime()));

  // Legend
  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  const fills = [0, 0.25, 0.5, 0.75, 1];
  const legendCells = document.createElement('div');
  legendCells.className = 'cal-legend-cells';
  fills.forEach(f => {
    const c = document.createElement('div');
    c.className = 'cal-legend-cell';
    c.style.setProperty('--fill-opacity', f * 0.88 + (f > 0 ? 0.08 : 0));
    legendCells.appendChild(c);
  });
  const legendLabels = document.createElement('div');
  legendLabels.className = 'cal-legend-labels';
  [t('calLess'), t('calMore')].forEach(txt => {
    const s = document.createElement('span'); s.textContent = txt;
    legendLabels.appendChild(s);
  });
  legend.appendChild(legendCells);
  legend.appendChild(legendLabels);
  scroll.appendChild(legend);

  // Generate months oldest → current (newest at bottom)
  let cur = new Date(startMonth.getFullYear(), startMonth.getMonth(), 1);
  const endMonth = new Date(todayD.getFullYear(), todayD.getMonth(), 1);

  while(cur <= endMonth){
    const monthEl = buildCalMonth(cur, countMap, total, locale, todayD);
    const isCurrentMonth = cur.getFullYear() === todayD.getFullYear() && cur.getMonth() === todayD.getMonth();
    if(isCurrentMonth) monthEl.id = 'cal-current-month';
    scroll.appendChild(monthEl);
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
}

function buildCalMonth(monthDate, countMap, total, locale, todayD){
  const year  = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const wrapper = document.createElement('div');
  wrapper.className = 'cal-month';

  // Month title
  const titleEl = document.createElement('div');
  titleEl.className = 'cal-month-title';
  const monthName = monthDate.toLocaleDateString(locale, { month: 'long' });
  const yearStr   = monthDate.toLocaleDateString(locale, { year: 'numeric' });
  titleEl.innerHTML = `<span>${monthName}</span><span class="cal-month-year">${yearStr}</span>`;
  wrapper.appendChild(titleEl);

  // Weekday labels (Mon-first) using locale narrow format
  const labels = document.createElement('div');
  labels.className = 'cal-day-labels';
  const monday = new Date(2024, 0, 1); // Jan 1 2024 = Monday
  for(let i = 0; i < 7; i++){
    const d = new Date(monday); d.setDate(d.getDate() + i);
    const lab = document.createElement('div');
    lab.className = 'cal-day-label';
    lab.textContent = d.toLocaleDateString(locale, { weekday: 'narrow' });
    labels.appendChild(lab);
  }
  wrapper.appendChild(labels);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  // Offset: first day of month, Mon=0 .. Sun=6
  const firstDayJS  = new Date(year, month, 1).getDay(); // 0=Sun
  const offset      = (firstDayJS + 6) % 7; // convert to Mon-based

  // Empty padding cells
  for(let i = 0; i < offset; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-cell cal-empty';
    grid.appendChild(empty);
  }

  // Day cells
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for(let day = 1; day <= daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const done    = countMap[dateStr] || 0;
    const pct     = total > 0 ? done / total : 0;
    const isPerfect = total > 0 && done === total;
    const isToday   = dateStr === TODAY;
    const isFuture  = dateStr > TODAY;

    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if(isToday)   cell.classList.add('cal-today');
    if(isFuture)  cell.classList.add('cal-future');

    // Fill opacity: maps 0→0, 1→0.92, with a base of 0.08 for any done > 0
    if(!isFuture && pct > 0){
      const alpha = 0.08 + pct * 0.84;
      cell.style.setProperty('--fill-opacity', alpha.toFixed(3));
      if(pct >= 0.5)  cell.classList.add('cal-mid');
      if(pct >= 0.75) cell.classList.add('cal-high');
    }

    const num = document.createElement('span');
    num.className = 'cal-day-num';
    num.textContent = day;
    cell.appendChild(num);

    // Perfect day marker
    if(isPerfect){
      const mark = document.createElement('span');
      mark.className = 'cal-perfect-mark';
      mark.textContent = '✦';
      cell.appendChild(mark);
    }

    // Tooltip
    if(!isFuture && total > 0){
      const dateLabel = new Date(dateStr + 'T12:00:00').toLocaleDateString(locale, { month:'short', day:'numeric' });
      cell.title = isPerfect ? `${dateLabel} · ✦ Perfect` : done > 0 ? `${dateLabel} · ${done}/${total}` : dateLabel;
    }

    grid.appendChild(cell);
  }

  wrapper.appendChild(grid);
  return wrapper;
}

   Auth & Init

function hideLoader() {
  const el = document.getElementById('page-loading');
  el.style.opacity = '0';
  setTimeout(() => { el.style.display = 'none'; }, 300);
}

function showGuestUI() {
  document.getElementById('login-btn').style.display = '';
  document.getElementById('user-picker-wrap').style.display = 'none';
}

function showLoggedInUI(user) {
  document.getElementById('login-btn').style.display = 'none';
  document.getElementById('user-picker-wrap').style.display = '';
  const initials = (user.email || '?').slice(0, 2).toUpperCase();
  document.getElementById('user-avatar-display').innerHTML =
    `<span class="user-avatar-initials">${initials}</span>`;
}

async function initApp() {
  try {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      // Guest mode: load from localStorage
      habits          = JSON.parse(localStorage.getItem('habitList') || '[]');
      _habitDataCache = JSON.parse(localStorage.getItem('habitData') || '{}');
      _metaCache      = JSON.parse(localStorage.getItem('habitMeta') ||
        '{"xp":0,"perfectDays":[],"freezeTokens":0}');
      showGuestUI();
      applyLanguage(currentLang);
      hideLoader();
      return;
    }

    currentUser = session.user;

    const [dbHabits, dbData, dbMeta] = await Promise.all([
      _dbLoadHabits(),
      _dbLoadData(),
      _dbLoadMeta(),
    ]);

    if (dbHabits.length === 0) {
      await _seedDefaultHabits();
    } else {
      habits = dbHabits;
    }
    _habitDataCache = dbData;
    _metaCache      = dbMeta;

    // Populate user menu
    const profile = await _dbLoadProfile();
    document.getElementById('user-menu-name').textContent =
      profile?.display_name || session.user.email?.split('@')[0] || '—';
    document.getElementById('user-menu-email').textContent = session.user.email || '—';

    showLoggedInUI(session.user);
    applyLanguage(currentLang);
    hideLoader();
  } catch(e) {
    console.error('initApp failed:', e);
    hideLoader();
  }
}

// User menu toggle
document.getElementById('user-btn').addEventListener('click', e => {
  e.stopPropagation();
  closeAll();
  document.getElementById('user-menu').classList.toggle('open');
});

// Sign out
document.getElementById('sign-out-btn').addEventListener('click', async () => {

});

// Handle session expiry mid-session
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') window.location.reload();
});

initApp();

/* ════════════════════════════════════════════
   Login Modal
   ════════════════════════════════════════════ */
(function(){
  const overlay  = document.getElementById('login-modal');
  const emailEl  = document.getElementById('lm-email');
  const pwEl     = document.getElementById('lm-password');
  const step1    = document.getElementById('lm-step1');
  const step2    = document.getElementById('lm-step2');
  const contBtn  = document.getElementById('lm-email-continue');
  const submitBtn= document.getElementById('lm-submit');
  const submitLbl= document.getElementById('lm-submit-label');
  const emailTag = document.getElementById('lm-email-tag');
  const msgEl    = document.getElementById('lm-msg');
  const toggleBtn= document.getElementById('lm-toggle-mode');
  const toggleTxt= document.getElementById('lm-toggle-text');
  let emailMode  = 'signin'; // 'signin' | 'signup'

  function openLoginModal() {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    resetModal();
    setTimeout(() => emailEl.focus(), 120);
  }
  function closeLoginModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  function resetModal() {
    showStep(1);
    emailEl.value = '';
    pwEl.value = '';
    clearMsg();
    emailMode = 'signin';
    submitLbl.textContent = 'Sign In';
    toggleTxt.textContent = 'No account?';
    toggleBtn.textContent = 'Create one →';
  }
  function showStep(n) {
    step1.style.display = n === 1 ? '' : 'none';
    step2.classList.toggle('visible', n === 2);
  }
  function showMsg(text, type = 'error') {
    msgEl.textContent = text;
    msgEl.className = `lm-msg ${type}`;
  }
  function clearMsg() { msgEl.className = 'lm-msg'; msgEl.textContent = ''; }
  function setLoading(btn, on) {
    btn.disabled = on;
    btn.classList.toggle('lm-loading', on);
  }

  // Open: Login button in toolbar
  document.getElementById('login-btn').addEventListener('click', openLoginModal);

  // Close
  document.getElementById('lm-close').addEventListener('click', closeLoginModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeLoginModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeLoginModal(); });

  // Email input → activate Continue button
  emailEl.addEventListener('input', () => {
    const hasEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim());
    contBtn.disabled = !hasEmail;
    contBtn.classList.toggle('active', hasEmail);
  });
  emailEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (!contBtn.disabled) goToStep2(); }
  });

  function goToStep2() {
    clearMsg();
    emailTag.textContent = emailEl.value.trim();
    showStep(2);
    setTimeout(() => pwEl.focus(), 80);
  }
  contBtn.addEventListener('click', goToStep2);

  // Back to step 1
  document.getElementById('lm-back').addEventListener('click', () => { showStep(1); clearMsg(); });

  // Toggle signin/signup
  toggleBtn.addEventListener('click', () => {
    if (emailMode === 'signin') {
      emailMode = 'signup';
      submitLbl.textContent = 'Create Account';
      toggleTxt.textContent = 'Have an account?';
      toggleBtn.textContent = 'Sign in →';
      pwEl.autocomplete = 'new-password';
    } else {
      emailMode = 'signin';
      submitLbl.textContent = 'Sign In';
      toggleTxt.textContent = 'No account?';
      toggleBtn.textContent = 'Create one →';
      pwEl.autocomplete = 'current-password';
    }
    clearMsg();
  });

  // Email submit
  submitBtn.addEventListener('click', async () => {
    const email    = emailEl.value.trim();
    const password = pwEl.value;
    clearMsg();
    if (!password || password.length < 6) {
      showMsg('Password must be at least 6 characters.'); return;
    }
    setLoading(submitBtn, true);
    if (emailMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setLoading(submitBtn, false);
      if (error) {
        if (error.message.toLowerCase().includes('invalid')) {
          showMsg('Wrong email or password. No account? Click "Create one" below.', 'error');
        } else {
          showMsg(error.message);
        }
      } else {
        closeLoginModal();
        window.location.reload();
      }
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      setLoading(submitBtn, false);
      if (error) {
        showMsg(error.message);
      } else {
        showMsg('Account created! Signing you in…', 'success');
        setTimeout(() => { closeLoginModal(); window.location.reload(); }, 1200);
      }
    }
  });
  pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });

  // Social auth
  async function socialAuth(provider) {
    const redirectTo = new URL('auth.html', window.location.href).href;
    const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo } });
    if (error) showMsg(error.message);
  }
  document.getElementById('lm-google').addEventListener('click', () => socialAuth('google'));
  document.getElementById('lm-github').addEventListener('click', () => socialAuth('github'));
})();
</script>
