    }
    :root[data-theme="white"] {
      --bg:#ffffff; --surface:#ffffff; --border:#e5e5e5; --border-hover:#d0d0d0;
      --accent:#171717; --accent-light:#444; --accent-rgb:23,23,23;
      --text:#171717; --text-dim:#737373; --text-muted:#d4d4d4;
      --toolbar-hover:#f5f5f5; --input-bg:#fafafa; --input-border:#e5e5e5;
      --stat-bg:#fafafa; --stat-border:#e5e5e5;
    }
    :root[data-theme="github"] {
      --bg:#0d1117; --surface:#161b22; --border:#30363d; --border-hover:#484f58;
      --accent:#238636; --accent-light:#3fb950; --accent-rgb:35,134,54;
      --text:#c9d1d9; --text-dim:#6e7681; --text-muted:#21262d;
      --toolbar-hover:#21262d; --input-bg:#0d1117; --input-border:#30363d;
      --stat-bg:#161b22; --stat-border:#30363d;
    }
    :root[data-theme="classic"] {
      --bg:#1a1a2e; --surface:#16213e; --border:#0f3460; --border-hover:#1a5276;
      --accent:#e94560; --accent-light:#ff6b81; --accent-rgb:233,69,96;
      --text:#eaeaea; --text-dim:#8892a4; --text-muted:#1a3a5c;
      --toolbar-hover:#0f3460; --input-bg:#1a1a2e; --input-border:#0f3460;
      --stat-bg:#16213e; --stat-border:#0f3460;
    }

    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:56px 16px 80px; transition:background .3s,color .3s;
    }

    /* ── Top bar ── */
    .top-bar { position:fixed; top:14px; left:18px; right:18px; display:flex; align-items:center; z-index:200; }
    .icon-btn {
      height:34px; min-width:34px; border-radius:10px; border:none; background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      gap:6px; padding:0 10px; transition:background .18s,color .18s; text-decoration:none;
      font-family:inherit; font-size:.8rem; font-weight:500;
    }
    .icon-btn:hover { background:var(--toolbar-hover); color:var(--text); }
    .icon-btn svg { width:16px; height:16px; fill:currentColor; }

    /* ── Loading ── */
    #loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:500; transition:opacity .3s; }
    .ring { width:32px; height:32px; border:2.5px solid rgba(var(--accent-rgb),.2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Profile card ── */
    .profile { width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; }

    /* ── Avatar ── */
    .avatar-wrap {
      position:relative; margin-bottom:18px; cursor:pointer; border-radius:50%;
      -webkit-tap-highlight-color:transparent;
    }
    .avatar {
      width:88px; height:88px; border-radius:50%;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:2.2rem; font-weight:700; text-transform:uppercase;
      overflow:hidden; user-select:none; transition:filter .2s;
    }
    .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
    .avatar-overlay {
      position:absolute; inset:0; border-radius:50%;
      background:rgba(0,0,0,.42);
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .2s;
    }
    .avatar-wrap:hover .avatar-overlay { opacity:1; }
    .avatar-overlay svg { width:22px; height:22px; fill:#fff; }
    #avatar-input { display:none; }

    /* ── Name ── */
    .name-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .display-name { font-size:1.4rem; font-weight:700; letter-spacing:-.01em; color:var(--text); }
    .edit-btn { background:none; border:none; cursor:pointer; color:var(--text-dim); padding:4px; display:flex; transition:color .15s; }
    .edit-btn:hover { color:var(--accent); }
    .edit-btn svg { width:15px; height:15px; fill:currentColor; }
    .name-input {
      font-size:1.4rem; font-weight:700; text-align:center;
      background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:10px;
      color:var(--text); font-family:inherit; padding:4px 12px; outline:none; max-width:280px;
      transition:border-color .15s;
    }
    .name-input:focus { border-color:var(--accent); }

    /* ── Level ── */
    .level-tag { font-size:.84rem; color:var(--text-dim); margin-bottom:10px; letter-spacing:.02em; }
    .level-tag b { color:var(--accent); font-weight:600; }

    /* ── Bio / motto ── */
    .bio-wrap { margin-bottom:28px; min-height:26px; display:flex; align-items:center; justify-content:center; }
    .bio-text {
      font-size:.84rem; color:var(--text-dim); text-align:center; cursor:pointer;
      padding:3px 10px; border-radius:8px; border:1px dashed transparent;
      transition:border-color .15s, color .15s; display:inline-block;
    }
    .bio-text:hover { border-color:var(--border-hover); color:var(--text); }
    .bio-text.empty { color:var(--text-muted); font-style:italic; }
    .bio-input {
      font-size:.84rem; text-align:center;
      background:var(--input-bg); border:1.5px solid var(--accent); border-radius:8px;
      color:var(--text); font-family:inherit; padding:4px 14px; outline:none;
      max-width:260px; width:100%;
    }

    /* ── Stats ── */
    .stat-grid { width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:32px; }
    .stat { background:var(--stat-bg); border:1px solid var(--stat-border); border-radius:14px; padding:16px 14px; display:flex; flex-direction:column; gap:4px; }
    .stat-val { font-size:1.5rem; font-weight:700; color:var(--text); letter-spacing:-.02em; }
    .stat-val .unit { font-size:.85rem; font-weight:600; color:var(--text-dim); margin-left:3px; }
    .stat-label { font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }

    /* ── Section label ── */
    .section-label { width:100%; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; margin-bottom:12px; }

    /* ── Heatmap ── */
    .heatmap { display:flex; gap:3px; width:100%; margin-bottom:32px; }
    .heatmap-week { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
    .heatmap-cell { aspect-ratio:1; border-radius:2px; background:var(--border); }
    .heatmap-cell[data-level="1"] { background:rgba(var(--accent-rgb),.18); }
    .heatmap-cell[data-level="2"] { background:rgba(var(--accent-rgb),.42); }
    .heatmap-cell[data-level="3"] { background:rgba(var(--accent-rgb),.70); }
    .heatmap-cell[data-level="4"] { background:var(--accent); }

    /* ── Achievements ── */
    .achievement-grid { width:100%; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .badge {
      display:flex; flex-direction:column; align-items:center; gap:5px;
      padding:14px 6px 12px; border-radius:14px;
      border:1.5px solid var(--border); background:var(--stat-bg);
      transition:border-color .25s, transform .15s; position:relative; overflow:hidden;
    }
    .badge.unlocked { border-color:rgba(var(--accent-rgb),.35); }
    .badge.unlocked:hover { transform:translateY(-2px); border-color:rgba(var(--accent-rgb),.65); }
    .badge.locked { opacity:.28; filter:grayscale(1); }
    .badge-icon { font-size:1.55rem; line-height:1; }
    .badge-name { font-size:.62rem; font-weight:700; color:var(--text); text-align:center; letter-spacing:.01em; line-height:1.3; }
    .badge-desc { font-size:.58rem; color:var(--text-dim); text-align:center; line-height:1.3; }
    .badge.unlocked::after {
      content:''; position:absolute; top:-12px; right:-12px;
      width:32px; height:32px; border-radius:50%;
      background:rgba(var(--accent-rgb),.1);
    }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--accent); color:#fff; padding:10px 20px; border-radius:12px;
      font-size:.84rem; font-weight:500; z-index:600; opacity:0;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  </style>
</head>

let currentUser = null;

/* ── Toast ── */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ── Avatar upload ── */
function initAvatar(userId){
  const wrap  = document.getElementById('avatar-wrap');
  const input = document.getElementById('avatar-input');
  wrap.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const dataUrl = await cropSquare(file, 160);
    setAvatarImg(dataUrl);
    localStorage.setItem('habitAvatar_'+userId, dataUrl);
    toast(T.avatarSaved);
    input.value = '';
  });
}

function cropSquare(file, size){
  return new Promise(resolve=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = url;
  });
}

function setAvatarImg(src){
  document.getElementById('avatar').innerHTML = `<img src="${src}" alt="avatar">`;
}

/* ── Bio / motto ── */
function initBio(userId){
  const bio = localStorage.getItem('habitBio_'+userId) || '';
  renderBio(bio);
  document.getElementById('bio-text').addEventListener('click', ()=>startBioEdit(userId));
}

function renderBio(bio){
  const el = document.getElementById('bio-text');
  if(bio){ el.textContent = bio; el.classList.remove('empty'); }
  else  { el.textContent = T.bioPlaceholder; el.classList.add('empty'); }
}

function startBioEdit(userId){
  const cur = localStorage.getItem('habitBio_'+userId) || '';
  const wrap = document.getElementById('bio-wrap');
  wrap.innerHTML = `<input class="bio-input" id="bio-input" maxlength="60" placeholder="${escapeHtml(T.bioPlaceholder)}" value="${escapeHtml(cur)}">`;
  const input = document.getElementById('bio-input');
  input.focus(); input.select();
  let done = false;
  const commit = ()=>{
    if(done) return; done = true;
    const val = input.value.trim();
    localStorage.setItem('habitBio_'+userId, val);
    wrap.innerHTML = `<span class="bio-text${val?'':' empty'}" id="bio-text"></span>`;
    renderBio(val);
    document.getElementById('bio-text').addEventListener('click', ()=>startBioEdit(userId));
    if(val !== cur) toast(T.bioSaved);
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } if(e.key==='Escape'){ input.value=cur; input.blur(); } });
  input.addEventListener('blur', commit);
}

/* ── Heatmap ── */
function renderHeatmap(checkinsByHabit, habitCount){
  const dateCount = {};
  Object.values(checkinsByHabit).forEach(dates=>dates.forEach(d=>{ dateCount[d]=(dateCount[d]||0)+1; }));

  const anchor = new Date(); anchor.setHours(0,0,0,0);
  const weeks = [];
  let week = [];
  for(let i=83; i>=0; i--){
    const d = new Date(anchor.getTime()); d.setDate(anchor.getDate()-i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const cnt = dateCount[ds]||0;
    let level = 0;
    if(habitCount>0 && cnt>0){ const r=cnt/habitCount; level=r<0.34?1:r<0.67?2:r<1?3:4; }
    week.push({ds,level});
    if(week.length===7){ weeks.push(week); week=[]; }
  }
  if(week.length) weeks.push(week);

  document.getElementById('heatmap').innerHTML = weeks.map(w=>
    `<div class="heatmap-week">${w.map(c=>`<div class="heatmap-cell" data-level="${c.level}" title="${c.ds}"></div>`).join('')}</div>`
  ).join('');
}

/* ── Achievements ── */
const BADGE_DEFS = [
  { icon:'🌱', check:d=>d.totalCheckins>=1  },
  { icon:'🔥', check:d=>d.bestStreak>=7     },
  { icon:'💎', check:d=>d.bestStreak>=30    },
  { icon:'⚡', check:d=>d.xp>=500          },
  { icon:'🎯', check:d=>d.perfectDays>=7   },
  { icon:'🏆', check:d=>d.level>=5         },
  { icon:'🌟', check:d=>d.habitCount>=5    },
  { icon:'👑', check:d=>d.level>=7         },
];

function renderAchievements(data){
  document.getElementById('achievement-grid').innerHTML = BADGE_DEFS.map((def,i)=>{
    const ok = def.check(data);
    const b  = T.badges[i];
    return `<div class="badge ${ok?'unlocked':'locked'}">
      <div class="badge-icon">${def.icon}</div>
      <div class="badge-name">${escapeHtml(b.name)}</div>
      <div class="badge-desc">${escapeHtml(b.desc)}</div>
    </div>`;
  }).join('');
}

/* ── Inline name edit ── */
function startEditName(){
  const cur = document.getElementById('display-name').textContent;
  const row = document.querySelector('.name-row');
  row.innerHTML = `<input class="name-input" id="name-input" maxlength="40" value="${escapeHtml(cur)}"/>`;
  const input = document.getElementById('name-input');
  input.focus(); input.select();
  let done = false;
  const commit = async ()=>{
    if(done) return; done = true;
    const val = input.value.trim();
    if(val && val!==cur){
      await sb.from('profiles').update({display_name:val, updated_at:new Date().toISOString()}).eq('id',currentUser.id);
      toast(T.saved);
    }
    rebuildNameRow(val||cur);
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); input.blur(); } if(e.key==='Escape'){input.value=cur;input.blur();} });
  input.addEventListener('blur', commit);
}

function rebuildNameRow(name){
  document.querySelector('.name-row').innerHTML =
    `<span class="display-name" id="display-name">${escapeHtml(name)}</span>
     <button class="edit-btn" id="edit-name-btn" aria-label="Edit name">
       <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
     </button>`;
  const av = document.getElementById('avatar');
  if(!av.querySelector('img')) av.textContent = (name||'?').slice(0,2);
  document.getElementById('edit-name-btn').addEventListener('click', startEditName);
}

/* ── Render ── */
function render(profile, meta, habits, checkinsByHabit){
  const name = profile?.display_name || currentUser.email?.split('@')[0] || 'You';
  document.getElementById('display-name').textContent = name;

  // Avatar
  const saved = localStorage.getItem('habitAvatar_'+currentUser.id) || profile?.avatar_url;
  if(saved) setAvatarImg(saved);
  else document.getElementById('avatar').textContent = (name||'?').slice(0,2);

  const xp    = meta?.xp||0;
  const lvIdx = getLevel(xp);
  document.getElementById('level-tag').innerHTML = `<b>${T.lv}${lvIdx+1}</b> · ${T.levels[lvIdx]}`;
  document.getElementById('stat-h').innerHTML    = `${xp.toLocaleString()}<span class="unit">H</span>`;
  document.getElementById('stat-perfect').textContent = (meta?.perfectDays?.length)||0;
  document.getElementById('stat-habits').textContent  = habits.length;

  let best=0, totalCheckins=0;
  habits.forEach(h=>{ const s=calcStreak(checkinsByHabit[h.id]||[]); if(s>best)best=s; totalCheckins+=(checkinsByHabit[h.id]||[]).length; });
  document.getElementById('stat-streak').textContent = best;

  renderHeatmap(checkinsByHabit, habits.length);
  renderAchievements({ xp, level:lvIdx+1, bestStreak:best, totalCheckins, perfectDays:(meta?.perfectDays?.length)||0, habitCount:habits.length });
}

/* ── Init ── */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.replace('index.html'); return; }
  currentUser = session.user;

  const [profileRes, metaRes, habitsRes, checkinsRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id',currentUser.id).single(),
    sb.from('user_meta').select('*').eq('user_id',currentUser.id).single(),
    sb.from('habits').select('*').order('sort_order'),
    sb.from('check_ins').select('habit_id,check_date'),
  ]);

  const profile = profileRes.data;
  const meta    = metaRes.data ? {xp:metaRes.data.xp, perfectDays:metaRes.data.perfect_days||[]} : {xp:0, perfectDays:[]};
  const habits  = (habitsRes.data||[]).map(r=>({id:r.id, name:r.name}));
  const checkinsByHabit = {};
  (checkinsRes.data||[]).forEach(r=>{ (checkinsByHabit[r.habit_id]=checkinsByHabit[r.habit_id]||[]).push(r.check_date); });

  render(profile, meta, habits, checkinsByHabit);
  initAvatar(currentUser.id);
  initBio(currentUser.id);
  document.getElementById('edit-name-btn').addEventListener('click', startEditName);

  document.getElementById('profile').style.display = 'flex';
  const loader = document.getElementById('loading');
  loader.style.opacity = '0';
  setTimeout(()=>loader.style.display='none', 300);
}

init();
</script>
