<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Habit</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes (mirror of index.html) ── */
    :root {
      --bg:#0a0a0a; --surface:#131313; --border:#1c1c1c; --border-hover:#2a2a2a;
      --accent:#7c6af7; --accent-light:#a89bf7; --accent-rgb:124,106,247;
      --text:#e2e2e2; --text-dim:#555; --text-muted:#2a2a2a;
      --toolbar-hover:#1a1a1a; --input-bg:#111; --input-border:#2a2a2a;
      --stat-bg:#131313; --stat-border:#1c1c1c;
    }
    :root[data-theme="light"] {
      --bg:#f5f7fa; --surface:#fff; --border:#e8eaed; --border-hover:#d0d3d8;
      --accent:#6c5ce7; --accent-light:#a29bfe; --accent-rgb:108,92,231;
      --text:#1a1a2e; --text-dim:#8888aa; --text-muted:#ccc;
      --toolbar-hover:#ebebeb; --input-bg:#f5f5fa; --input-border:#ddd;
      --stat-bg:#fff; --stat-border:#e8eaed;
    }
    :root[data-theme="white"] {
      --bg:#ffffff; --surface:#ffffff; --border:#e5e5e5; --border-hover:#d0d0d0;
      --accent:#171717; --accent-light:#444; --accent-rgb:23,23,23;
      --text:#171717; --text-dim:#737373; --text-muted:#d4d4d4;
      --toolbar-hover:#f5f5f5; --input-bg:#fafafa; --input-border:#e5e5e5;
      --stat-bg:#fafafa; --stat-border:#e5e5e5;
    }
    :root[data-theme="github"] {
      --bg:#0d1117; --surface:#161b22; --border:#30363d; --border-hover:#484f58;
      --accent:#238636; --accent-light:#3fb950; --accent-rgb:35,134,54;
      --text:#c9d1d9; --text-dim:#6e7681; --text-muted:#21262d;
      --toolbar-hover:#21262d; --input-bg:#0d1117; --input-border:#30363d;
      --stat-bg:#161b22; --stat-border:#30363d;
    }
    :root[data-theme="classic"] {
      --bg:#1a1a2e; --surface:#16213e; --border:#0f3460; --border-hover:#1a5276;
      --accent:#e94560; --accent-light:#ff6b81; --accent-rgb:233,69,96;
      --text:#eaeaea; --text-dim:#8892a4; --text-muted:#1a3a5c;
      --toolbar-hover:#0f3460; --input-bg:#1a1a2e; --input-border:#0f3460;
      --stat-bg:#16213e; --stat-border:#0f3460;
    }

    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:56px 16px 64px; transition:background .3s,color .3s;
    }

    /* ── Top bar ── */
    .top-bar { position:fixed; top:14px; left:18px; right:18px; display:flex; align-items:center; justify-content:space-between; z-index:200; }
    .icon-btn {
      height:34px; min-width:34px; border-radius:10px; border:none; background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      gap:6px; padding:0 10px; transition:background .18s,color .18s; text-decoration:none;
      font-family:inherit; font-size:.8rem; font-weight:500;
    }
    .icon-btn:hover { background:var(--toolbar-hover); color:var(--text); }
    .icon-btn svg { width:16px; height:16px; fill:currentColor; }

    /* ── Loading ── */
    #loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:500; transition:opacity .3s; }
    .ring { width:32px; height:32px; border:2.5px solid rgba(var(--accent-rgb),.2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Profile card ── */
    .profile { width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; }

    .avatar {
      width:84px; height:84px; border-radius:50%;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:2rem; font-weight:700; text-transform:uppercase;
      box-shadow:0 8px 24px rgba(var(--accent-rgb),.3); margin-bottom:18px;
    }

    .name-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .display-name { font-size:1.4rem; font-weight:700; letter-spacing:-.01em; color:var(--text); }
    .edit-btn { background:none; border:none; cursor:pointer; color:var(--text-dim); padding:4px; display:flex; transition:color .15s; }
    .edit-btn:hover { color:var(--accent); }
    .edit-btn svg { width:15px; height:15px; fill:currentColor; }
    .name-input {
      font-size:1.4rem; font-weight:700; text-align:center;
      background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:10px;
      color:var(--text); font-family:inherit; padding:4px 12px; outline:none; max-width:280px;
      transition:border-color .15s;
    }
    .name-input:focus { border-color:var(--accent); }

    .level-tag { font-size:.84rem; color:var(--text-dim); margin-bottom:28px; letter-spacing:.02em; }
    .level-tag b { color:var(--accent); font-weight:600; }

    /* ── Stat grid ── */
    .stat-grid {
      width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:28px;
    }
    .stat {
      background:var(--stat-bg); border:1px solid var(--stat-border); border-radius:14px;
      padding:16px 14px; display:flex; flex-direction:column; gap:4px;
    }
    .stat-val { font-size:1.5rem; font-weight:700; color:var(--text); letter-spacing:-.02em; }
    .stat-val .unit { font-size:.85rem; font-weight:600; color:var(--text-dim); margin-left:3px; }
    .stat-label { font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }

    /* ── Habit list ── */
    .section-label { width:100%; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; }
    .habit-row {
      width:100%; display:flex; align-items:center; justify-content:space-between;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:12px 16px; margin-bottom:8px;
    }
    .habit-row-name { font-size:.9rem; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .habit-row-streak { font-size:.82rem; color:var(--text-dim); flex-shrink:0; margin-left:12px; }
    .empty-habits { width:100%; text-align:center; color:var(--text-dim); font-size:.85rem; padding:24px 0; }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--accent); color:#fff; padding:10px 20px; border-radius:12px;
      font-size:.84rem; font-weight:500; z-index:600; opacity:0;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  </style>
</head>
<body>

<div id="loading"><div class="ring"></div></div>

<div class="top-bar">
  <a class="icon-btn" href="index.html" aria-label="Back to habits">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    <span id="t-back">Habits</span>
  </a>
</div>

<div class="profile" id="profile" style="display:none">
  <div class="avatar" id="avatar">?</div>

  <div class="name-row">
    <span class="display-name" id="display-name">—</span>
    <button class="edit-btn" id="edit-name-btn" aria-label="Edit name">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </div>

  <div class="level-tag" id="level-tag">—</div>

  <div class="stat-grid">
    <div class="stat">
      <div class="stat-val" id="stat-h">0<span class="unit">H</span></div>
      <div class="stat-label" id="t-totalh">Total H</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-streak">0</div>
      <div class="stat-label" id="t-beststreak">Best streak</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-perfect">0</div>
      <div class="stat-label" id="t-perfectdays">Perfect days</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-habits">0</div>
      <div class="stat-label" id="t-habits">Habits</div>
    </div>
  </div>

  <div class="section-label" id="t-yourhabits">Your habits</div>
  <div id="habit-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════
   Config + theme + i18n (ported subset)
   ════════════════════════════════════════════ */
const SUPABASE_URL      = 'https://gwxncicsscmaxjxolvwu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iuVW38hMMD6IHa1r0SAHbA_aQg3XnGv';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Apply saved theme immediately
const theme = localStorage.getItem('habitTheme') || 'white';
document.documentElement.setAttribute('data-theme', theme);

const lang = localStorage.getItem('habitLang') || 'en';
const I18N = {
  en:{ back:'Habits', totalH:'Total H', best:'Best streak', perfect:'Perfect days', habits:'Habits', yours:'Your habits', noHabits:'No habits yet', dayStreak:n=>`${n>0?'🔥':'○'} ${n} day streak`, lv:'Lv.', saved:'Name updated', levels:['Newcomer','Consistent','Dedicated','Focused','Master','Champion','Legend'] },
  zh:{ back:'习惯', totalH:'总 H', best:'最长连续', perfect:'完美日', habits:'习惯数', yours:'你的习惯', noHabits:'还没有习惯', dayStreak:n=>`${n>0?'🔥':'○'} 连续 ${n} 天`, lv:'Lv.', saved:'名字已更新', levels:['新手','稳定','专注','精进','大师','强者','传奇'] },
  es:{ back:'Hábitos', totalH:'H total', best:'Mejor racha', perfect:'Días perfectos', habits:'Hábitos', yours:'Tus hábitos', noHabits:'Aún sin hábitos', dayStreak:n=>`${n>0?'🔥':'○'} ${n} días seguidos`, lv:'Nv.', saved:'Nombre actualizado', levels:['Novato','Constante','Dedicado','Enfocado','Maestro','Campeón','Leyenda'] },
  ko:{ back:'습관', totalH:'총 H', best:'최고 연속', perfect:'완벽한 날', habits:'습관', yours:'내 습관', noHabits:'아직 습관이 없습니다', dayStreak:n=>`${n>0?'🔥':'○'} ${n}일 연속`, lv:'Lv.', saved:'이름이 업데이트됨', levels:['초보자','꾸준함','헌신','집중','달인','챔피언','전설'] },
  ja:{ back:'習慣', totalH:'合計 H', best:'最長連続', perfect:'完璧な日', habits:'習慣', yours:'あなたの習慣', noHabits:'まだ習慣がありません', dayStreak:n=>`${n>0?'🔥':'○'} ${n}日連続`, lv:'Lv.', saved:'名前を更新しました', levels:['初心者','安定','専念','精進','達人','強者','伝説'] },
  vi:{ back:'Thói quen', totalH:'Tổng H', best:'Chuỗi tốt nhất', perfect:'Ngày hoàn hảo', habits:'Thói quen', yours:'Thói quen của bạn', noHabits:'Chưa có thói quen', dayStreak:n=>`${n>0?'🔥':'○'} ${n} ngày liên tiếp`, lv:'Cấp', saved:'Đã cập nhật tên', levels:['Người mới','Kiên định','Chuyên tâm','Tập trung','Bậc thầy','Vô địch','Huyền thoại'] },
  th:{ back:'นิสัย', totalH:'H รวม', best:'สถิติดีสุด', perfect:'วันสมบูรณ์', habits:'นิสัย', yours:'นิสัยของคุณ', noHabits:'ยังไม่มีนิสัย', dayStreak:n=>`${n>0?'🔥':'○'} ${n} วันติด`, lv:'Lv.', saved:'อัปเดตชื่อแล้ว', levels:['มือใหม่','สม่ำเสมอ','ทุ่มเท','มุ่งมั่น','เชี่ยวชาญ','แชมป์','ตำนาน'] },
};
const T = I18N[lang] || I18N.en;

const LEVELS = [0,100,300,700,1500,3000,6000];
function getLevel(xp){ let idx=0; for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i]){idx=i;break;} } return idx; }

const TODAY = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function prevDay(s){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function calcStreak(dates){ const set=new Set(dates); let cur=set.has(TODAY)?TODAY:prevDay(TODAY); if(!set.has(cur))return 0; let n=0; while(set.has(cur)){n++;cur=prevDay(cur);} return n; }

/* ════════════════════════════════════════════
   Apply static i18n labels
   ════════════════════════════════════════════ */
document.getElementById('t-back').textContent       = T.back;
document.getElementById('t-totalh').textContent      = T.totalH;
document.getElementById('t-beststreak').textContent  = T.best;
document.getElementById('t-perfectdays').textContent = T.perfect;
document.getElementById('t-habits').textContent      = T.habits;
document.getElementById('t-yourhabits').textContent  = T.yours;

let currentUser = null;

/* ════════════════════════════════════════════
   Toast
   ════════════════════════════════════════════ */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ════════════════════════════════════════════
   Render
   ════════════════════════════════════════════ */
function render(profile, meta, habits, checkinsByHabit){
  const name = profile?.display_name || currentUser.email?.split('@')[0] || 'You';
  document.getElementById('display-name').textContent = name;
  document.getElementById('avatar').textContent = (name||'?').slice(0,2);

  const xp = meta?.xp || 0;
  const lvIdx = getLevel(xp);
  document.getElementById('level-tag').innerHTML = `<b>${T.lv}${lvIdx+1}</b> · ${T.levels[lvIdx]}`;

  document.getElementById('stat-h').innerHTML = `${xp.toLocaleString()}<span class="unit">H</span>`;
  document.getElementById('stat-perfect').textContent = (meta?.perfectDays?.length) || 0;
  document.getElementById('stat-habits').textContent = habits.length;

  // Best current streak across all habits
  let best = 0;
  habits.forEach(h=>{ const s = calcStreak(checkinsByHabit[h.id]||[]); if(s>best) best=s; });
  document.getElementById('stat-streak').textContent = best;

  // Habit list with per-habit streak
  const list = document.getElementById('habit-list');
  if(habits.length === 0){
    list.innerHTML = `<div class="empty-habits">${T.noHabits}</div>`;
  } else {
    list.innerHTML = habits.map(h=>{
      const s = calcStreak(checkinsByHabit[h.id]||[]);
      return `<div class="habit-row">
        <span class="habit-row-name">${escapeHtml(h.name)}</span>
        <span class="habit-row-streak">${T.dayStreak(s)}</span>
      </div>`;
    }).join('');
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ════════════════════════════════════════════
   Inline name edit
   ════════════════════════════════════════════ */
function startEditName(){
  const cur = document.getElementById('display-name').textContent;
  const row = document.querySelector('.name-row');
  row.innerHTML = `<input class="name-input" id="name-input" maxlength="40" value="${escapeHtml(cur)}"/>`;
  const input = document.getElementById('name-input');
  input.focus(); input.select();
  const commit = async ()=>{
    const val = input.value.trim();
    if(val && val !== cur){
      await sb.from('profiles').update({ display_name: val, updated_at: new Date().toISOString() }).eq('id', currentUser.id);
      toast(T.saved);
    }
    rebuildNameRow(val || cur);
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); if(e.key==='Escape'){ input.value=cur; input.blur(); } });
  input.addEventListener('blur', commit);
}

function rebuildNameRow(name){
  const row = document.querySelector('.name-row');
  row.innerHTML = `<span class="display-name" id="display-name">${escapeHtml(name)}</span>
    <button class="edit-btn" id="edit-name-btn" aria-label="Edit name">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>`;
  document.getElementById('avatar').textContent = (name||'?').slice(0,2);
  document.getElementById('edit-name-btn').addEventListener('click', startEditName);
}

/* ════════════════════════════════════════════
   Init
   ════════════════════════════════════════════ */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.replace('index.html'); return; }
  currentUser = session.user;

  const [profileRes, metaRes, habitsRes, checkinsRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id', currentUser.id).single(),
    sb.from('user_meta').select('*').eq('user_id', currentUser.id).single(),
    sb.from('habits').select('*').order('sort_order'),
    sb.from('check_ins').select('habit_id,check_date'),
  ]);

  const profile = profileRes.data;
  const meta = metaRes.data ? { xp:metaRes.data.xp, perfectDays:metaRes.data.perfect_days||[] } : { xp:0, perfectDays:[] };
  const habits = (habitsRes.data||[]).map(r=>({ id:r.id, name:r.name }));
  const checkinsByHabit = {};
  (checkinsRes.data||[]).forEach(row=>{ (checkinsByHabit[row.habit_id]=checkinsByHabit[row.habit_id]||[]).push(row.check_date); });

  render(profile, meta, habits, checkinsByHabit);
  document.getElementById('edit-name-btn').addEventListener('click', startEditName);

  document.getElementById('profile').style.display = 'flex';
  const loader = document.getElementById('loading');
  loader.style.opacity = '0';
  setTimeout(()=>loader.style.display='none', 300);
}

init();
</script>
</body>
</html>
