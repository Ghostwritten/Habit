<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Habit</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:#0a0a0a; --surface:#131313; --border:#1c1c1c; --border-hover:#2a2a2a;
      --accent:#7c6af7; --accent-light:#a89bf7; --accent-rgb:124,106,247;
      --text:#e2e2e2; --text-dim:#555; --text-muted:#2a2a2a;
      --toolbar-hover:#1a1a1a; --input-bg:#111; --input-border:#2a2a2a;
      --stat-bg:#131313; --stat-border:#1c1c1c;
    }
    :root[data-theme="light"] {
      --bg:#f5f7fa; --surface:#fff; --border:#e8eaed; --border-hover:#d0d3d8;
      --accent:#6c5ce7; --accent-light:#a29bfe; --accent-rgb:108,92,231;
      --text:#1a1a2e; --text-dim:#8888aa; --text-muted:#ccc;
      --toolbar-hover:#ebebeb; --input-bg:#f5f5fa; --input-border:#ddd;
      --stat-bg:#fff; --stat-border:#e8eaed;
    }
    :root[data-theme="white"] {
      --bg:#ffffff; --surface:#ffffff; --border:#e5e5e5; --border-hover:#d0d0d0;
      --accent:#171717; --accent-light:#444; --accent-rgb:23,23,23;
      --text:#171717; --text-dim:#737373; --text-muted:#d4d4d4;
      --toolbar-hover:#f5f5f5; --input-bg:#fafafa; --input-border:#e5e5e5;
      --stat-bg:#fafafa; --stat-border:#e5e5e5;
    }
    :root[data-theme="github"] {
      --bg:#0d1117; --surface:#161b22; --border:#30363d; --border-hover:#484f58;
      --accent:#238636; --accent-light:#3fb950; --accent-rgb:35,134,54;
      --text:#c9d1d9; --text-dim:#6e7681; --text-muted:#21262d;
      --toolbar-hover:#21262d; --input-bg:#0d1117; --input-border:#30363d;
      --stat-bg:#161b22; --stat-border:#30363d;
    }
    :root[data-theme="classic"] {
      --bg:#1a1a2e; --surface:#16213e; --border:#0f3460; --border-hover:#1a5276;
      --accent:#e94560; --accent-light:#ff6b81; --accent-rgb:233,69,96;
      --text:#eaeaea; --text-dim:#8892a4; --text-muted:#1a3a5c;
      --toolbar-hover:#0f3460; --input-bg:#1a1a2e; --input-border:#0f3460;
      --stat-bg:#16213e; --stat-border:#0f3460;
    }

    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:56px 16px 80px; transition:background .3s,color .3s;
    }

    /* ── Top bar ── */
    .top-bar { position:fixed; top:14px; left:18px; right:18px; display:flex; align-items:center; z-index:200; }
    .icon-btn {
      height:34px; min-width:34px; border-radius:10px; border:none; background:transparent;
      color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      gap:6px; padding:0 10px; transition:background .18s,color .18s; text-decoration:none;
      font-family:inherit; font-size:.8rem; font-weight:500;
    }
    .icon-btn:hover { background:var(--toolbar-hover); color:var(--text); }
    .icon-btn svg { width:16px; height:16px; fill:currentColor; }

    /* ── Loading ── */
    #loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:500; transition:opacity .3s; }
    .ring { width:32px; height:32px; border:2.5px solid rgba(var(--accent-rgb),.2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Profile card ── */
    .profile { width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; }

    /* ── Avatar ── */
    .avatar-wrap {
      position:relative; margin-bottom:18px; cursor:pointer; border-radius:50%;
      -webkit-tap-highlight-color:transparent;
    }
    .avatar {
      width:88px; height:88px; border-radius:50%;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:2.2rem; font-weight:700; text-transform:uppercase;
      overflow:hidden; user-select:none; transition:filter .2s;
    }
    .avatar img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
    .avatar-overlay {
      position:absolute; inset:0; border-radius:50%;
      background:rgba(0,0,0,.42);
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity .2s;
    }
    .avatar-wrap:hover .avatar-overlay { opacity:1; }
    .avatar-overlay svg { width:22px; height:22px; fill:#fff; }
    #avatar-input { display:none; }

    /* ── Name ── */
    .name-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .display-name { font-size:1.4rem; font-weight:700; letter-spacing:-.01em; color:var(--text); }
    .edit-btn { background:none; border:none; cursor:pointer; color:var(--text-dim); padding:4px; display:flex; transition:color .15s; }
    .edit-btn:hover { color:var(--accent); }
    .edit-btn svg { width:15px; height:15px; fill:currentColor; }
    .name-input {
      font-size:1.4rem; font-weight:700; text-align:center;
      background:var(--input-bg); border:1.5px solid var(--input-border); border-radius:10px;
      color:var(--text); font-family:inherit; padding:4px 12px; outline:none; max-width:280px;
      transition:border-color .15s;
    }
    .name-input:focus { border-color:var(--accent); }

    /* ── Level ── */
    .level-tag { font-size:.84rem; color:var(--text-dim); margin-bottom:10px; letter-spacing:.02em; }
    .level-tag b { color:var(--accent); font-weight:600; }

    /* ── Bio / motto ── */
    .bio-wrap { margin-bottom:28px; min-height:26px; display:flex; align-items:center; justify-content:center; }
    .bio-text {
      font-size:.84rem; color:var(--text-dim); text-align:center; cursor:pointer;
      padding:3px 10px; border-radius:8px; border:1px dashed transparent;
      transition:border-color .15s, color .15s; display:inline-block;
    }
    .bio-text:hover { border-color:var(--border-hover); color:var(--text); }
    .bio-text.empty { color:var(--text-muted); font-style:italic; }
    .bio-input {
      font-size:.84rem; text-align:center;
      background:var(--input-bg); border:1.5px solid var(--accent); border-radius:8px;
      color:var(--text); font-family:inherit; padding:4px 14px; outline:none;
      max-width:260px; width:100%;
    }

    /* ── Stats ── */
    .stat-grid { width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:32px; }
    .stat { background:var(--stat-bg); border:1px solid var(--stat-border); border-radius:14px; padding:16px 14px; display:flex; flex-direction:column; gap:4px; }
    .stat-val { font-size:1.5rem; font-weight:700; color:var(--text); letter-spacing:-.02em; }
    .stat-val .unit { font-size:.85rem; font-weight:600; color:var(--text-dim); margin-left:3px; }
    .stat-label { font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }

    /* ── Section label ── */
    .section-label { width:100%; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; margin-bottom:12px; }

    /* ── Heatmap ── */
    .heatmap { display:flex; gap:3px; width:100%; margin-bottom:32px; }
    .heatmap-week { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
    .heatmap-cell { aspect-ratio:1; border-radius:2px; background:var(--border); }
    .heatmap-cell[data-level="1"] { background:rgba(var(--accent-rgb),.18); }
    .heatmap-cell[data-level="2"] { background:rgba(var(--accent-rgb),.42); }
    .heatmap-cell[data-level="3"] { background:rgba(var(--accent-rgb),.70); }
    .heatmap-cell[data-level="4"] { background:var(--accent); }

    /* ── Share sheet ── */
    .share-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:700;
      display:flex; align-items:flex-end; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .25s;
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    }
    .share-overlay.open { opacity:1; pointer-events:all; }
    .share-sheet {
      width:100%; max-width:460px; margin:0 8px;
      background:var(--surface); border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      max-height:92vh; overflow-y:auto;
      transform:translateY(100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
    }
    .share-overlay.open .share-sheet {
      transform:translateY(0);
      transition:transform .34s cubic-bezier(.34,1.15,.64,1);
    }
    .share-sheet::before {
      content:''; display:block; width:36px; height:4px;
      background:var(--border); border-radius:2px;
      margin:0 auto 16px;
    }
    .share-header {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
    }
    .share-title { font-size:.88rem; font-weight:600; color:var(--text); letter-spacing:.01em; }
    .share-close {
      background:none; border:none; cursor:pointer; color:var(--text-dim);
      padding:4px; display:flex; border-radius:8px; transition:color .15s,background .15s;
    }
    .share-close:hover { color:var(--text); background:var(--toolbar-hover); }
    .share-close svg { width:18px; height:18px; fill:currentColor; }

    /* Card preview */
    .card-preview {
      width:auto; height:170px; border-radius:14px; overflow:hidden; margin-bottom:14px;
      background:#07070f; aspect-ratio:4/5; position:relative;
      display:flex; align-items:center; justify-content:center;
      margin-left:auto; margin-right:auto;
    }
    .card-preview canvas { height:100% !important; width:auto !important; display:block; }
    .card-preview-loading {
      color:rgba(255,255,255,.22); font-size:.68rem;
      letter-spacing:.1em; text-transform:uppercase;
    }

    /* Share action buttons */
    .share-actions { display:flex; gap:6px; justify-content:space-around; }
    .share-action {
      display:flex; flex-direction:column; align-items:center; gap:7px;
      cursor:pointer; background:none; border:none; font-family:inherit;
      padding:0; flex:1; -webkit-tap-highlight-color:transparent;
    }
    .share-action-icon {
      width:50px; height:50px; border-radius:50%;
      background:var(--stat-bg); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      transition:background .18s,border-color .18s; color:var(--text);
    }
    .share-action:hover .share-action-icon { background:var(--toolbar-hover); border-color:var(--border-hover); }
    .share-action svg { fill:currentColor; }
    .share-action span { font-size:.64rem; color:var(--text-dim); letter-spacing:.02em; text-align:center; }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--accent); color:#fff; padding:10px 20px; border-radius:12px;
      font-size:.84rem; font-weight:500; z-index:600; opacity:0;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  </style>
</head>

const T = I18N[lang] || I18N.en;

const LEVELS = [0,100,300,700,1500,3000,6000];
function getLevel(xp){ let idx=0; for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i]){idx=i;break;} } return idx; }

const TODAY = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
function prevDay(s){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function calcStreak(dates){ const set=new Set(dates); let cur=set.has(TODAY)?TODAY:prevDay(TODAY); if(!set.has(cur))return 0; let n=0; while(set.has(cur)){n++;cur=prevDay(cur);} return n; }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── Avatar upload ── */
function initAvatar(userId){
  const wrap  = document.getElementById('avatar-wrap');
  const input = document.getElementById('avatar-input');
  wrap.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const dataUrl = await cropSquare(file, 160);
    setAvatarImg(dataUrl);
    localStorage.setItem('habitAvatar_'+userId, dataUrl);
    toast(T.avatarSaved);
    input.value = '';
  });
}

function cropSquare(file, size){
  return new Promise(resolve=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = url;
  });
}

function setAvatarImg(src){
  document.getElementById('avatar').innerHTML = `<img src="${src}" alt="avatar">`;
}

/* ── Heatmap ── */
function renderHeatmap(checkinsByHabit, habitCount){
  const dateCount = {};
  Object.values(checkinsByHabit).forEach(dates=>dates.forEach(d=>{ dateCount[d]=(dateCount[d]||0)+1; }));

  const anchor = new Date(); anchor.setHours(0,0,0,0);
  const weeks = [];
  let week = [];
  for(let i=83; i>=0; i--){
    const d = new Date(anchor.getTime()); d.setDate(anchor.getDate()-i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const cnt = dateCount[ds]||0;
    let level = 0;
    if(habitCount>0 && cnt>0){ const r=cnt/habitCount; level=r<0.34?1:r<0.67?2:r<1?3:4; }
    week.push({ds,level});
    if(week.length===7){ weeks.push(week); week=[]; }
  }
  if(week.length) weeks.push(week);

  document.getElementById('heatmap').innerHTML = weeks.map(w=>
    `<div class="heatmap-week">${w.map(c=>`<div class="heatmap-cell" data-level="${c.level}" title="${c.ds}"></div>`).join('')}</div>`
  ).join('');
}

function render(profile, meta, habits, checkinsByHabit){
  const name = profile?.display_name || currentUser.email?.split('@')[0] || 'You';
  document.getElementById('display-name').textContent = name;

}

/* ════════════════════════════════════════════
   Canvas helpers
   ════════════════════════════════════════════ */
function cRR(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function fillSpaced(ctx,text,x,y,sp){
  let w=0; for(const ch of text) w+=ctx.measureText(ch).width; w+=sp*(text.length-1);
  let cx=x-w/2;
  for(const ch of text){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+sp; }
}

/* ════════════════════════════════════════════
   Share card generator  (1080 × 1350)
   ════════════════════════════════════════════ */
async function generateShareCard(){
  const W=1080, H=1350, CX=540;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  /* — Background — */
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#07070f'); bg.addColorStop(.55,'#0a0a17'); bg.addColorStop(1,'#060610');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  /* — Radial glow (behind avatar) — */
  const gl=ctx.createRadialGradient(CX,295,0,CX,295,340);
  gl.addColorStop(0,'rgba(124,106,247,.18)');
  gl.addColorStop(.65,'rgba(124,106,247,.05)');
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);

  /* — HABIT wordmark — */
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,.17)';
  ctx.font='600 13px -apple-system,system-ui,sans-serif';
  fillSpaced(ctx,'HABIT',CX,78,12);

  /* — Thin rule — */
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(80,96); ctx.lineTo(W-80,96); ctx.stroke();

  /* — Avatar ring — */
  ctx.strokeStyle='rgba(124,106,247,.22)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(CX,295,97,0,Math.PI*2); ctx.stroke();

  /* — Avatar image or initials — */
  const avR=88;
  const avSrc=localStorage.getItem('habitAvatar_'+(currentUser?.id||''));
  if(avSrc){
    await new Promise(res=>{
      const img=new Image();
      img.onload=()=>{
        ctx.save();
        ctx.beginPath(); ctx.arc(CX,295,avR,0,Math.PI*2); ctx.clip();
        ctx.drawImage(img,CX-avR,295-avR,avR*2,avR*2);
        ctx.restore(); res();
      };
      img.onerror=res; img.src=avSrc;
    });
  } else {
    ctx.fillStyle='#1e1a3d';
    ctx.beginPath(); ctx.arc(CX,295,avR,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`700 ${Math.round(avR*.64)}px -apple-system,system-ui,sans-serif`;
    ctx.fillText((cardData.name||'?').slice(0,2).toUpperCase(),CX,296);
    ctx.textBaseline='alphabetic';
  }

  /* — Name — */
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.font='700 52px -apple-system,system-ui,sans-serif';
  ctx.fillText(cardData.name||'—',CX,437);

  /* — Level — */
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.font='400 23px -apple-system,system-ui,sans-serif';
  ctx.fillText(`${T.lv}${cardData.lvIdx+1} · ${T.levels[cardData.lvIdx]}`,CX,476);

  /* — Motto — */
  let statsY=548;
  if(cardData.bio){
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.font='300 19px -apple-system,system-ui,sans-serif';
    ctx.fillText(`"${cardData.bio}"`,CX,518);
    statsY=578;
  }

  /* — Stats surface — */
  const sX=80, sW=W-160, sH=196, sY=statsY;
  ctx.fillStyle='rgba(255,255,255,.03)';
  cRR(ctx,sX,sY,sW,sH,22); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  cRR(ctx,sX,sY,sW,sH,22); ctx.stroke();

  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(CX,sY+26); ctx.lineTo(CX,sY+sH-26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sX+26,sY+sH/2); ctx.lineTo(sX+sW-26,sY+sH/2); ctx.stroke();

  const s4=[
    {v:`${(cardData.xp||0).toLocaleString()} H`, l:'TOTAL'},
    {v:`${cardData.best}`,                        l:'BEST STREAK'},
    {v:`${cardData.perfectDays}`,                  l:'PERFECT DAYS'},
    {v:`${cardData.habitCount}`,                   l:'HABITS'},
  ];
  s4.forEach((s,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const sx=sX+col*(sW/2)+sW/4, sy=sY+row*(sH/2)+sH/4;
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.font='700 38px -apple-system,system-ui,sans-serif';
    ctx.fillText(s.v,sx,sy+10);
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.font='400 13px -apple-system,system-ui,sans-serif';
    ctx.fillText(s.l,sx,sy+34);
  });

  /* — Activity label — */
  const hmLblY=sY+sH+54;
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.font='500 12px -apple-system,system-ui,sans-serif';
  fillSpaced(ctx,'ACTIVITY',CX,hmLblY,4);

  /* — Heatmap — */
  const hmY=hmLblY+22;
  const cellW=Math.floor((sW-11*4)/12), cellH=14, gX=4, gY=4;
  const hmW=12*cellW+11*gX;
  const hmX=CX-hmW/2;

  const dc={};
  Object.values(cardData.checkinsByHabit||{}).forEach(dates=>dates.forEach(d=>{dc[d]=(dc[d]||0)+1;}));
  const anch=new Date(); anch.setHours(0,0,0,0);
  const wks=[]; let wk=[];
  for(let i=83;i>=0;i--){
    const dd=new Date(anch.getTime()); dd.setDate(anch.getDate()-i);
    const ds=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    const cnt=dc[ds]||0, hc=cardData.habitCount||1;
    let lv=0; if(cnt>0){const r=cnt/hc;lv=r<.34?1:r<.67?2:r<1?3:4;}
    wk.push(lv); if(wk.length===7){wks.push(wk);wk=[];}
  }
  if(wk.length) wks.push(wk);

  const clr=['rgba(255,255,255,.06)','rgba(124,106,247,.25)','rgba(124,106,247,.52)','rgba(124,106,247,.78)','rgba(124,106,247,1)'];
  wks.forEach((days,wi)=>{
    days.forEach((lv,di)=>{
      const x=hmX+wi*(cellW+gX), y=hmY+di*(cellH+gY);
      if(lv===4){ctx.shadowColor='rgba(124,106,247,.6)';ctx.shadowBlur=10;}
      ctx.fillStyle=clr[lv];
      cRR(ctx,x,y,cellW,cellH,3); ctx.fill();
      ctx.shadowBlur=0;
    });
  });
  ctx.shadowBlur=0;

  /* — Footer — */
  const ftY=H-100;
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(80,ftY); ctx.lineTo(W-80,ftY); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.font='400 13px -apple-system,system-ui,sans-serif';
  ctx.textAlign='left'; ctx.fillText('habit',80,ftY+30);
  ctx.textAlign='right'; ctx.fillText(TODAY,W-80,ftY+30);

  return cv;
}

    currentUser={id:'demo',email:'alex@example.com'};
    const cb={};
    for(let i=0;i<60;i++)if(i%3!==2)(cb.h1=cb.h1||[]).push(dA(i));
    for(let i=0;i<30;i++)if(i%2===0)(cb.h2=cb.h2||[]).push(dA(i));
    for(let i=0;i<10;i++)(cb.h3=cb.h3||[]).push(dA(i));
    const habits=[{id:'h1',name:'Morning run'},{id:'h2',name:'Read 30min'},{id:'h3',name:'Meditate'}];
    render({display_name:'Alex Chen'},{xp:2840,perfectDays:Array(8).fill('x')},habits,cb);
    initAvatar('demo');initBio('demo');initShare();
    document.getElementById('edit-name-btn').addEventListener('click',startEditName);
    document.getElementById('profile').style.display='flex';
    const l=document.getElementById('loading');l.style.opacity='0';setTimeout(()=>l.style.display='none',300);
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.replace('index.html'); return; }
  currentUser = session.user;

  const [profileRes, metaRes, habitsRes, checkinsRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id',currentUser.id).single(),
    sb.from('user_meta').select('*').eq('user_id',currentUser.id).single(),
    sb.from('habits').select('*').order('sort_order'),
    sb.from('check_ins').select('habit_id,check_date'),
  ]);

  const profile = profileRes.data;
  const meta    = metaRes.data ? {xp:metaRes.data.xp, perfectDays:metaRes.data.perfect_days||[]} : {xp:0, perfectDays:[]};
  const habits  = (habitsRes.data||[]).map(r=>({id:r.id, name:r.name}));
  const checkinsByHabit = {};
  (checkinsRes.data||[]).forEach(r=>{ (checkinsByHabit[r.habit_id]=checkinsByHabit[r.habit_id]||[]).push(r.check_date); });

  render(profile, meta, habits, checkinsByHabit);
  initAvatar(currentUser.id);
  initBio(currentUser.id);
  initShare();
  document.getElementById('edit-name-btn').addEventListener('click', startEditName);

  document.getElementById('profile').style.display = 'flex';
  const loader = document.getElementById('loading');
  loader.style.opacity = '0';
  setTimeout(()=>loader.style.display='none', 300);
}

init();
</script>
</body>
</html>
