<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Habit Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      padding: 24px 16px;
      /* Subtle radial glow */
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,247,.08) 0%, transparent 70%);
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #07070a; z-index: 100;
      transition: opacity .3s;
    }
    .loading-ring {
      width: 36px; height: 36px;
      border: 3px solid rgba(124,106,247,.2);
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Card ── */
    .auth-card {
      width: 100%; max-width: 400px;
      background: #111114;
      border: 1px solid #1e1e24;
      border-radius: 24px;
      padding: 36px 32px 28px;
      box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
      animation: cardIn .4s cubic-bezier(.22,1,.36,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(16px) scale(.97); }
      to   { opacity:1; transform:translateY(0)    scale(1);   }
    }

    /* ── Logo ── */
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .auth-logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #7c6af7, #a89bf7);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; line-height: 1;
      box-shadow: 0 4px 12px rgba(124,106,247,.4);
    }
    .auth-logo-text {
      font-size: .72rem; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: #e2e2e2;
    }
    .auth-logo-sub {
      font-size: .62rem; color: #555; letter-spacing: .06em;
      margin-top: 1px;
    }

    /* ── Headings ── */
    .auth-title {
      font-size: 1.35rem; font-weight: 700;
      color: #eee; letter-spacing: -.01em;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: .82rem; color: #555;
      margin-bottom: 24px;
    }

    /* ── Social buttons ── */
    .social-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .social-btn {
      width: 100%; height: 44px;
      border-radius: 11px; border: 1px solid transparent;
      font-size: .84rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; transition: opacity .15s, transform .1s, box-shadow .15s;
      font-family: inherit; letter-spacing: .01em;
    }
    .social-btn:hover { opacity: .88; transform: translateY(-1px); }
    .social-btn:active { transform: translateY(0); }
    .social-btn svg { flex-shrink: 0; }

    .btn-google {
      background: #fff; color: #3c4043;
      border-color: #dadce0;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .btn-github {
      background: #24292e; color: #fff;
      border-color: #30363d;
    }

    /* ── Divider ── */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 4px 0 20px; color: #333; font-size: .75rem;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: #1e1e24;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 14px; }

    .field-label {
      display: block; font-size: .72rem; color: #888;
      letter-spacing: .04em; text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%; height: 44px;
      background: #0d0d11; border: 1px solid #252530;
      border-radius: 10px; color: #e2e2e2;
      font-size: .9rem; font-family: inherit;
      padding: 0 14px; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field-input:focus {
      border-color: #7c6af7;
      box-shadow: 0 0 0 3px rgba(124,106,247,.12);
    }
    .field-input::placeholder { color: #333; }

    .pw-wrap { position: relative; }
    .pw-wrap .field-input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 0; top: 0;
      width: 44px; height: 44px;
      background: none; border: none; cursor: pointer;
      color: #444; font-size: .85rem;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s;
    }
    .pw-toggle:hover { color: #888; }

    /* ── Forgot password ── */
    .forgot-row {
      text-align: right; margin-top: -6px; margin-bottom: 16px;
    }
    .forgot-link {
      background: none; border: none; cursor: pointer;
      color: #555; font-size: .75rem; font-family: inherit;
      transition: color .15s;
    }
    .forgot-link:hover { color: #7c6af7; }

    /* ── Messages ── */
    .auth-msg {
      border-radius: 9px; font-size: .8rem;
      padding: 10px 12px; margin-bottom: 14px;
      display: none; align-items: flex-start; gap: 8px;
      animation: msgIn .2s ease-out;
    }
    @keyframes msgIn {
      from { opacity:0; transform:translateY(-4px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .auth-msg.error {
      display: flex;
      background: rgba(220,50,50,.1);
      border: 1px solid rgba(220,50,50,.25);
      color: #ff6b6b;
    }
    .auth-msg.success {
      display: flex;
      background: rgba(35,134,54,.1);
      border: 1px solid rgba(35,134,54,.25);
      color: #3fb950;
    }
    .auth-msg.info {
      display: flex;
      background: rgba(124,106,247,.1);
      border: 1px solid rgba(124,106,247,.25);
      color: #a89bf7;
    }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%; height: 46px; margin-top: 4px;
      background: linear-gradient(135deg, #7c6af7, #9d8df7);
      border: none; border-radius: 11px;
      color: #fff; font-size: .9rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .18s, transform .1s, box-shadow .18s;
      box-shadow: 0 4px 16px rgba(124,106,247,.35);
      letter-spacing: .01em;
    }
    .submit-btn:hover:not(:disabled) {
      opacity: .9; transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,106,247,.45);
    }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .55; cursor: not-allowed; }

    .btn-spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .loading .btn-spinner { display: block; }
    .loading .btn-text    { display: none; }

    /* ── Toggle mode ── */
    .auth-toggle {
      text-align: center; margin-top: 20px;
      font-size: .8rem; color: #555;
    }
    .toggle-btn {
      background: none; border: none; cursor: pointer;
      color: #7c6af7; font-size: .8rem; font-family: inherit;
      font-weight: 500; margin-left: 4px;
      transition: opacity .15s;
    }
    .toggle-btn:hover { opacity: .75; }

    /* ── Back link ── */
    .back-link {
      display: none; background: none; border: none; cursor: pointer;
      color: #555; font-size: .8rem; font-family: inherit;
      align-items: center; gap: 4px; margin-bottom: 20px;
      transition: color .15s;
    }
    .back-link:hover { color: #888; }
    .back-link.show  { display: flex; }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="loading-ring"></div>
</div>

<!-- Auth card -->
<div class="auth-card" id="auth-card" style="display:none">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-mark">✦</div>
    <div>
      <div class="auth-logo-text">Habit Tracker</div>
      <div class="auth-logo-sub">Build better every day</div>
    </div>
  </div>

  <!-- Back link (for forgot-password mode) -->
  <button class="back-link" id="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to sign in
  </button>

  <h1 class="auth-title" id="auth-title">Welcome back</h1>
  <p class="auth-subtitle" id="auth-subtitle">Sign in to continue your streak</p>

  <!-- Social buttons -->
  <div class="social-btns" id="social-btns">
    <button class="social-btn btn-google" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <button class="social-btn btn-github" id="btn-github">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>
      Continue with GitHub
    </button>
  </div>

  <!-- Divider -->
  <div class="or-divider" id="or-divider">or</div>

  <!-- Email form -->
  <form id="auth-form">
    <div class="field">
      <label class="field-label" for="email-input">Email</label>
      <input class="field-input" type="email" id="email-input"
             placeholder="you@example.com" autocomplete="email" required />
    </div>

    <div class="field" id="pw-field">
      <label class="field-label" for="pw-input">Password</label>
      <div class="pw-wrap">
        <input class="field-input" type="password" id="pw-input"
               placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="forgot-row" id="forgot-row">
      <button type="button" class="forgot-link" id="forgot-btn">Forgot password?</button>
    </div>

    <!-- Messages -->
    <div class="auth-msg" id="auth-msg"></div>

    <button type="submit" class="submit-btn" id="submit-btn">
      <span class="btn-text" id="submit-label">Sign In</span>
      <div class="btn-spinner"></div>
    </button>
  </form>

  <div class="auth-toggle" id="toggle-row">
    <span id="toggle-text">Don't have an account?</span>
    <button class="toggle-btn" id="toggle-btn">Sign up</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   Supabase Init
   ════════════════════════════════════════════ */
const SUPABASE_URL     = 'https://gwxncicsscmaxjxolvwu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iuVW38hMMD6IHa1r0SAHbA_aQg3XnGv';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ════════════════════════════════════════════
   Mode management: 'signin' | 'signup' | 'forgot'
   ════════════════════════════════════════════ */
let mode = 'signin';

const $title      = document.getElementById('auth-title');
const $subtitle   = document.getElementById('auth-subtitle');
const $submitLbl  = document.getElementById('submit-label');
const $toggleText = document.getElementById('toggle-text');
const $toggleBtn  = document.getElementById('toggle-btn');
const $forgotRow  = document.getElementById('forgot-row');
const $pwField    = document.getElementById('pw-field');
const $backLink   = document.getElementById('back-link');
const $socialBtns = document.getElementById('social-btns');
const $orDivider  = document.getElementById('or-divider');
const $toggleRow  = document.getElementById('toggle-row');
const $msgEl      = document.getElementById('auth-msg');
const $submitBtn  = document.getElementById('submit-btn');
const $emailInput = document.getElementById('email-input');
const $pwInput    = document.getElementById('pw-input');

function setMode(m) {
  mode = m;
  clearMsg();
  if (m === 'signin') {
    $title.textContent      = 'Welcome back';
    $subtitle.textContent   = 'Sign in to continue your streak';
    $submitLbl.textContent  = 'Sign In';
    $toggleText.textContent = "Don't have an account?";
    $toggleBtn.textContent  = 'Sign up';
    $forgotRow.style.display = '';
    $pwField.style.display   = '';
    $backLink.classList.remove('show');
    $socialBtns.style.display = '';
    $orDivider.style.display  = '';
    $toggleRow.style.display  = '';
    $pwInput.autocomplete     = 'current-password';
  } else if (m === 'signup') {
    $title.textContent      = 'Create account';
    $subtitle.textContent   = 'Start building better habits today';
    $submitLbl.textContent  = 'Create Account';
    $toggleText.textContent = 'Already have an account?';
    $toggleBtn.textContent  = 'Sign in';
    $forgotRow.style.display = 'none';
    $pwField.style.display   = '';
    $backLink.classList.remove('show');
    $socialBtns.style.display = '';
    $orDivider.style.display  = '';
    $toggleRow.style.display  = '';
    $pwInput.autocomplete     = 'new-password';
  } else { // forgot
    $title.textContent      = 'Reset password';
    $subtitle.textContent   = "Enter your email and we'll send a reset link";
    $submitLbl.textContent  = 'Send Reset Link';
    $pwField.style.display   = 'none';
    $forgotRow.style.display = 'none';
    $backLink.classList.add('show');
    $socialBtns.style.display = 'none';
    $orDivider.style.display  = 'none';
    $toggleRow.style.display  = 'none';
  }
}

function setLoading(on) {
  $submitBtn.disabled = on;
  $submitBtn.classList.toggle('loading', on);
}

function showMsg(text, type = 'error') {
  $msgEl.textContent = text;
  $msgEl.className = `auth-msg ${type}`;
  // Force re-animation
  $msgEl.style.animation = 'none';
  void $msgEl.offsetWidth;
  $msgEl.style.animation = '';
}

function clearMsg() { $msgEl.className = 'auth-msg'; $msgEl.textContent = ''; }

/* ── Password toggle ── */
document.getElementById('pw-toggle').addEventListener('click', () => {
  const isPassword = $pwInput.type === 'password';
  $pwInput.type = isPassword ? 'text' : 'password';
  document.getElementById('eye-icon').innerHTML = isPassword
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23" stroke-width="2" stroke-linecap="round"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

/* ── Toggle mode ── */
$toggleBtn.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));
document.getElementById('forgot-btn').addEventListener('click', () => setMode('forgot'));
$backLink.addEventListener('click', () => setMode('signin'));

/* ── Social auth ── */
async function socialAuth(provider) {
  setLoading(true);
  clearMsg();
  const redirectTo = new URL('auth.html', window.location.href).href;
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo }
  });
  if (error) { showMsg(error.message); setLoading(false); }
}

document.getElementById('btn-google').addEventListener('click', () => socialAuth('google'));
document.getElementById('btn-github').addEventListener('click', () => socialAuth('github'));

/* ── Email form submit ── */
document.getElementById('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email    = $emailInput.value.trim();
  const password = $pwInput.value;
  clearMsg();

  if (!email) { showMsg('Please enter your email address.'); return; }

  setLoading(true);

  if (mode === 'forgot') {
    const redirectTo = new URL('auth.html', window.location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    setLoading(false);
    if (error) showMsg(error.message);
    else       showMsg('Check your email for a password reset link.', 'success');
    return;
  }

  if (!password || password.length < 6) {
    setLoading(false);
    showMsg('Password must be at least 6 characters.');
    return;
  }

  if (mode === 'signin') {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) {
      if (error.message.includes('Email not confirmed')) {
        showMsg('Please confirm your email first. Check your inbox.', 'info');
      } else {
        showMsg('Invalid email or password. Please try again.');
      }
    }
    // Auth state change listener will handle redirect

  } else { // signup
    const { error } = await sb.auth.signUp({ email, password });
    setLoading(false);
    if (error) {
      if (error.message.includes('already registered')) {
        showMsg('An account with this email already exists.', 'info');
      } else {
        showMsg(error.message);
      }
    } else {
      showMsg('Account created! Check your email to confirm, then sign in.', 'success');
      setMode('signin');
      $emailInput.value = email;
    }
  }
});

/* ════════════════════════════════════════════
   Init — check session, handle OAuth callback
   ════════════════════════════════════════════ */
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      window.location.replace('index.html');
      return;
    }
  } catch (e) {
    console.warn('Session check failed:', e);
  }

  // Show card
  document.getElementById('loading-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('auth-card').style.display = 'block';
  }, 300);
}

// Listen for successful auth → redirect
sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
    window.location.replace('index.html');
  }
});

init();
</script>
</body>
</html>
