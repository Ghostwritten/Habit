<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit — Signing in…</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    }
    .ring {
      width: 36px; height: 36px;
      border: 3px solid rgba(124,106,247,.2);
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ring"></div>
  <script>
    const SUPABASE_URL      = 'https://gwxncicsscmaxjxolvwu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_iuVW38hMMD6IHa1r0SAHbA_aQg3XnGv';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.auth.onAuthStateChange((event, session) => {
      if (session) window.location.replace('index.html');
    });

    // Fallback: if already has session on load, redirect immediately
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.replace('index.html');
    });
  </script>
</body>
</html>
